<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>

<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PROBET"/>
<meta name="theme-color" content="#040c16"/>
<title>PROBET — Bot Stratégique Football</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#040c16;--card:#0a1929;--card2:#0b1929;--card3:#071321;--border:#1a2d45;--border2:#1e3a52;--green:#00e5a0;--blue:#00b4d8;--red:#ff4d6d;--yellow:#ffd600;--purple:#a78bfa;--orange:#f97316;--text:#dce8f5;--muted:#6a8fa8;--dim:#3d6585;--mono:'IBM Plex Mono',monospace;--disp:'Bebas Neue',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;min-height:100vh;overscroll-behavior:none}
body{background:linear-gradient(160deg,#040c16,#060f1c,#050b15);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{background:var(--card2);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;width:100%;outline:none;-webkit-appearance:none;font-family:'Barlow',sans-serif}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
input::placeholder,textarea::placeholder{color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;padding:0;background:transparent!important;border:none!important}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#00e5a0,#00b4d8)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #00e5a0;margin-top:-8px}input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#00e5a0,#00b4d8)}input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #00e5a0}
label{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
#app{max-width:520px;margin:0 auto;padding:0 12px}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#040c16 80%,rgba(4,12,22,0));padding:12px 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--disp);font-size:30px;letter-spacing:3px;line-height:1;background:linear-gradient(135deg,#00e5a0,#00b4d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ttl{font-family:var(--disp);font-size:24px;letter-spacing:1.5px;line-height:1.05;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;flex-shrink:0}
.ibtn{height:34px;padding:0 10px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;flex-shrink:0}
.eng{display:inline-flex;align-items:center;gap:5px;background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.2);padding:5px 10px;border-radius:20px;font-family:var(--mono);font-size:9px;color:var(--green);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin:8px 0}
.seg button{padding:9px 4px;border:none;border-radius:9px;background:transparent;color:var(--dim);font-family:var(--mono);font-size:11px}
.seg button.on{background:linear-gradient(135deg,var(--green),var(--blue));color:#000;font-weight:700}
.seg button.live.on{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap}
.chip.on{background:rgba(0,180,216,.15);border-color:var(--blue);color:#fff}
.chip.ong{background:rgba(0,229,160,.14);border-color:var(--green);color:var(--green)}
.sec{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:2px;margin:16px 2px 8px}
.list{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid #0d2035;cursor:pointer;min-height:50px}
.row:last-child{border-bottom:none}
.row:active{background:#0d2137}
.row .ic{width:28px;height:28px;border-radius:8px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.row .nm small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);font-weight:400;margin-top:2px}
.cnt{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px;text-align:right}
.star{background:none;border:none;font-size:18px;color:#2a4a66;padding:2px 2px 2px 6px;line-height:1}
.star.on{color:var(--yellow)}
.chev{color:var(--dim);font-size:12px;transition:transform .2s;width:14px;text-align:center}
.chev.open{transform:rotate(90deg)}
.sublist{background:var(--card3);border-bottom:1px solid #0d2035}
.sublist .row{padding-left:26px;min-height:44px}
.sublist .row .nm{font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.mrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.mtop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mtime{font-family:var(--mono);font-size:10px;color:var(--blue);background:rgba(0,180,216,.08);border:1px solid rgba(0,180,216,.2);border-radius:6px;padding:2px 7px;flex-shrink:0}
.mlive{color:#fff;background:var(--red);border-color:var(--red)}
.mteams{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.odd{background:var(--card3);border:1px solid var(--border2);border-radius:9px;padding:7px 4px;text-align:center;color:var(--text)}
.odd span{display:block;font-family:var(--mono);font-size:9px;color:var(--dim)}
.odd b{font-family:var(--disp);font-size:18px;letter-spacing:.5px}
.odd.sel{border-color:var(--green);background:rgba(0,229,160,.12)}
.btn{width:100%;padding:14px;border:none;border-radius:13px;font-family:var(--disp);font-size:20px;letter-spacing:1.5px;color:#000;background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 4px 22px rgba(0,229,160,.22)}
.btn.pur{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 4px 22px rgba(167,139,250,.25)}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);box-shadow:none;font-size:16px;padding:11px}
.btn:disabled{opacity:.5}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:20px;display:inline-block;margin:2px 2px 2px 0;border:1px solid}
.load{text-align:center;padding:26px 10px}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 10px}
.lmsg{font-family:var(--mono);font-size:10px;color:var(--green);animation:shimmer 1.5s ease-in-out infinite}
.err{background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.25);border-radius:10px;padding:11px 13px;color:#ff6b80;font-family:var(--mono);font-size:11px;line-height:1.6;margin-bottom:12px;word-break:break-word}
.info{background:rgba(0,180,216,.06);border:1px solid rgba(0,180,216,.18);border-radius:10px;padding:10px 12px;color:#8fb5cc;font-size:12px;line-height:1.6;margin-bottom:12px}
.warn{background:rgba(255,214,0,.05);border:1px solid rgba(255,214,0,.15);border-radius:10px;padding:10px 12px;color:#b8a347;font-size:11px;line-height:1.6;margin:12px 0}
.empty{text-align:center;padding:50px 20px;color:var(--dim);font-family:var(--mono);font-size:11px;line-height:1.8}
.empty b{display:block;font-size:34px;margin-bottom:8px}
.pick{background:var(--card3);border:1px solid var(--border2);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pmk{font-family:var(--mono);font-size:9px;color:var(--blue)}
.psel{font-family:var(--disp);font-size:19px;letter-spacing:.5px;line-height:1.1;margin-top:2px}
.pwhy{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:5px}
.note{font-family:var(--disp);font-size:22px;line-height:1;text-align:center;min-width:48px}
.note small{display:block;font-family:var(--mono);font-size:8px;color:var(--dim)}
.add{border:1px solid rgba(0,229,160,.35);background:rgba(0,229,160,.1);color:var(--green);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:10px;margin-top:7px}
.add.done{border-color:var(--border2);background:transparent;color:var(--dim)}
.ticket-h{background:linear-gradient(135deg,#00e5a0,#00b4d8);border-radius:14px 14px 0 0;padding:13px 15px;color:#000;display:flex;justify-content:space-between;align-items:center}
.ticket-b{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:4px 14px 14px}
.tsel{padding:11px 0;border-bottom:1px dashed #12304a}
.tsel:last-child{border-bottom:none}
.codd{width:72px;text-align:center;font-family:var(--disp);font-size:18px;padding:6px 4px}
.x{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.25);color:#ff4d6d;border-radius:8px;width:30px;height:30px;font-size:13px;flex-shrink:0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.kv b{font-family:var(--disp);font-size:22px;color:var(--text);letter-spacing:.5px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(6,16,29,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bn button{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:9px;padding:4px 0;position:relative}
nav.bn button .i{font-size:20px;line-height:1}
nav.bn button.on{color:var(--green)}
nav.bn .cbtn .i{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(0,229,160,.4);border:3px solid var(--bg)}
nav.bn .cbtn.on{color:var(--green)}
.nbadge{position:absolute;top:-24px;right:calc(50% - 32px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:#0f2a40;border:1px solid var(--green);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.search{position:relative;margin:4px 0 6px}
.search input{padding-left:34px}
.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeup .3s ease}

/* ── Version ordinateur (écrans larges) ── */
.desk-only,.side-logo{display:none}
@media (min-width:1024px){
  body{padding-bottom:30px;padding-left:230px}
  #app{max-width:1180px;padding:0 28px}
  nav.bn{left:0;top:0;bottom:0;right:auto;width:230px;border-top:none;border-right:1px solid var(--border);padding:22px 14px}
  nav.bn .in{max-width:none;display:flex;flex-direction:column;align-items:stretch;gap:6px}
  nav.bn .side-logo{display:block;font-family:var(--disp);font-size:30px;letter-spacing:3px;color:var(--green);padding:0 10px 18px;text-shadow:0 0 18px rgba(0,229,160,.35)}
  nav.bn .side-logo small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);margin-top:2px}
  nav.bn button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:13px;padding:12px 14px;border-radius:12px;font-family:inherit;font-weight:600;text-align:left}
  nav.bn button:hover{background:rgba(0,229,160,.06);color:var(--text)}
  nav.bn button.on{background:rgba(0,229,160,.1);color:var(--green)}
  nav.bn .cbtn .i{width:auto;height:auto;margin:0;border:none;box-shadow:none;background:none;font-size:20px}
  .nbadge{position:static;margin-left:auto;border:none}
  #toast{bottom:30px;left:calc(50% + 115px)}
  .desk-only{display:block}
  .list{display:grid;grid-template-columns:1fr 1fr}
  .list .row{border-right:1px solid var(--border)}
  .gcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
  .gcol-b{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
  .gcol-b #gen-res{display:none}
  .card:hover,.list .row:hover,.mrow:hover{border-color:rgba(0,229,160,.28)}
  .row,.mrow,.chip,.btn{cursor:pointer}
}
@media (min-width:1500px){#app{max-width:1320px}}
.dayhdr{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin:14px 2px 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
</style>

<body>
<div id="app"><div id="main"></div></div>

<nav class="bn"><div class="in">
  <div class="side-logo">PROBET<small>BOT STRATÉGIQUE FOOTBALL</small></div>
  <button id="nb-pop" onclick="goTab('pop')"><span class="i">🔥</span>Populaire</button>
  <button id="nb-fav" onclick="goTab('fav')"><span class="i">⭐</span>Favoris</button>
  <button id="nb-coupon" class="cbtn" onclick="goTab('coupon')"><span class="i">🎯</span>Bot<span class="nbadge" id="cbadge" style="display:none">0</span></button>
  <button id="nb-hist" onclick="goTab('hist')"><span class="i">🕘</span>Historique</button>
  <button id="nb-menu" onclick="goTab('menu')"><span class="i">☰</span>Menu</button>
</div></nav>
<div id="toast"></div>
<input type="file" id="file-in" accept="image/*,video/*,.pdf,application/pdf" style="display:none" onchange="handleFile(event)"/>

<script>
// ═══════════════════════════════════════════════════════════════
// PROBET v12 — Bot stratégique football
// Aucune clé API n'est écrite dans ce fichier : elles sont saisies
// dans Menu et stockées uniquement dans le navigateur.
// ═══════════════════════════════════════════════════════════════

// ── Stockage local ─────────────────────────────────────────────
function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(_){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(_){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(_){} }
function jGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(_){ return d; } }
function jSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }

// ── Moteurs IA ────────────────────────────────────────────────
const IS_CLAUDE = location.hostname.includes("claude.ai") || location.hostname.includes("anthropic.com") || location.protocol==="blob:";
const PROV_STORE="probet_provider";
const KEY_STORES={claude:"probet_claude_key",groq:"probet_groq_key"};
const CEREBRAS_KEY="probet_cerebras_key";
const PROVIDERS={
  claude:{name:"Claude",model:"claude-sonnet-5-5",tag:"CLAUDE SONNET 5.5 · WEB",color:"#a78bfa",ph:"sk-ant-..."},
  groq:{name:"Groq",model:"openai/gpt-oss-120b",tag:"GROQ GPT-OSS 120B · WEB · GRATUIT",color:"#f97316",ph:"gsk_..."}
};
function getProvider(){ const p=lsGet(PROV_STORE); return PROVIDERS[p]?p:"groq"; }
function getKey(p){ return lsGet(KEY_STORES[p||getProvider()]); }
function engineName(){ return IS_CLAUDE?"Claude":PROVIDERS[getProvider()].name; }

function needKey(){
  setTimeout(()=>{ goTab("menu"); toast("🔑 Ajoute ta clé API "+engineName()+" dans le Menu"); },50);
  return new Error("Clé API "+engineName()+" manquante. Ajoute-la dans Menu.");
}

async function callClaude(sys,usr,imgB64,imgMime,maxSearch,maxTok){
  const content=[];
  if(Array.isArray(imgB64)) imgB64.slice(0,12).forEach(im=>content.push({type:"image",source:{type:"base64",media_type:im.mime,data:im.b64}}));
  else if(imgB64&&imgMime) content.push({type:"image",source:{type:"base64",media_type:imgMime,data:imgB64}});
  content.push({type:"text",text:usr});
  const headers={"Content-Type":"application/json"};
  const body={model:IS_CLAUDE?"claude-sonnet-4-20250514":PROVIDERS.claude.model,max_tokens:maxTok||8000,messages:[{role:"user",content}]};
  if(sys) body.system=sys;
  if(!IS_CLAUDE){
    const key=getKey("claude"); if(!key) throw needKey();
    headers["x-api-key"]=key; headers["anthropic-version"]="2023-06-01"; headers["anthropic-dangerous-direct-browser-access"]="true";
    if(maxSearch) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:maxSearch}];
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||"Claude API "+res.status); }
  const d=await res.json();
  const t=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!t) throw new Error("Claude : réponse vide. Réessaie.");
  return t;
}
async function callGroq(sys,usr,imgB64,imgMime,maxTok,maxSearch){
  const key=getKey("groq"); if(!key) throw needKey();
  if(imgB64) throw new Error("Groq ne lit pas les images. Colle le texte du coupon, ou passe sur Claude dans Menu.");
  const messages=[]; if(sys) messages.push({role:"system",content:sys}); messages.push({role:"user",content:usr});
  // Modes essayés dans l'ordre : recherche obligatoire → recherche facultative → sans recherche
  const modes=maxSearch===0?["none"]:st.strictSearch?["required","required"]:maxSearch===1?["auto","none"]:["required","auto","none"];
  let lastErr;
  for(const mode of modes){
    const extra=mode==="none"?{}:{tools:[{type:"browser_search"}],tool_choice:mode};
    const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:PROVIDERS.groq.model,messages,temperature:0.3,max_completion_tokens:Math.min(maxTok||8000,8000),reasoning_effort:"low",...extra})});
    if(!res.ok){
      const e=await res.json().catch(()=>({}));const msg=e?.error?.message||("Groq "+res.status);
      if(/tool choice|did not call a tool|tool_use_failed|tool call|browser_search|failed to call/i.test(msg)){lastErr=new Error(msg);continue;}
      throw new Error(msg+(res.status===429||res.status===413?" — Limite gratuite Groq atteinte : attends une minute, ou réduis le nombre de matchs/coupons.":""));
    }
    const d=await res.json();
    const t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
    if(t) return t;
    lastErr=new Error("Groq : réponse vide (limite de longueur ou quota). Réessaie dans un instant.");
  }
  if(st.strictSearch) throw new Error("Recherche web impossible pour le moment : le bot préfère ne rien proposer plutôt qu'inventer des matchs. Réessaie dans une minute.");
  throw lastErr||new Error("Groq : pas de réponse");
}

  return picked.map(e=>{const t=new Date(e.commence_time);return{t1:e.home_team,t2:e.away_team,comp:frComp(e.sport_title),date:localDay(t),heure:t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),cal:true};});
}
async function verifyFixtures(sels,opt){
  opt=opt||{};
  const out=[],removed=[];const teamsSeen=[];
  for(const s of sels){
    const [t1,t2]=String(s.match||"").split(/\s+vs\.?\s+|\s+-\s+|\s+–\s+/i);
    const dup=[t1,t2].find(t=>t&&teamsSeen.some(x=>sameTeam(x,t)));
    if(dup){removed.push({match:s.match,why:"équipe présente deux fois ("+dup.trim()+")"});continue;}
    if(opt.only&&!opt.only.some(m=>(sameTeam(t1,m.t1)&&sameTeam(t2||"",m.t2))||(sameTeam(t1,m.t2)&&sameTeam(t2||"",m.t1)))){removed.push({match:s.match,why:"ne fait pas partie des matchs étudiés"});continue;}
    teamsSeen.push(t1,t2);out.push(Object.assign({},s,{_t1:t1,_t2:t2||"",_c:String(s.competition||s.comp||"")}));
  }
  const clean=x=>{const y=Object.assign({},x);delete y._t1;delete y._t2;delete y._c;return y;};
  if(!oddsKey()){out.forEach(s=>s.verif="none");return{sels:out.map(clean),removed,checked:false};}
  let avail;try{avail=await allSoccerKeys();}catch(ex){out.forEach(s=>s.verif="none");return{sels:out.map(clean),removed,checked:false};}
  const find=(ev,s)=>ev.find(e=>(sameTeam(s._t1,e.home_team)&&sameTeam(s._t2,e.away_team))||(sameTeam(s._t1,e.away_team)&&sameTeam(s._t2,e.home_team)));
  // 1) championnats probables d'abord, 2) tout le reste si besoin
  const first=[];out.forEach(s=>keysForComp(s._c,avail).forEach(k=>{if(!first.includes(k))first.push(k);}));
  let pool=(await eventsFor(first)).ev;let failed=0;
  if(out.some(s=>!find(pool,s))){const rest=avail.filter(k=>!first.includes(k));const r=await eventsFor(rest,(i,n)=>{if(typeof setGenMsg==="function")setGenMsg("✅ Vérification au calendrier "+i+"/"+n+"...");});pool=pool.concat(r.ev);failed=r.failed;}
  failed+=first.filter(k=>evByKey[k]&&!evByKey[k].ok).length;
  const final=[];
  for(const s of out){
    const e=find(pool,s);
    if(e){
      if(opt.day&&localDay(e.commence_time)!==opt.day){removed.push({match:s.match,why:"ne se joue pas ce jour-là (prévu le "+new Date(e.commence_time).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+")"});continue;}
      const reversed=sameTeam(s._t1,e.away_team)&&!sameTeam(s._t1,e.home_team);
      const t=new Date(e.commence_time);
      const n=Object.assign({},s,{verif:"ok",match:e.home_team+" vs "+e.away_team,competition:frComp(e.sport_title)||s._c,heure:t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),date:localDay(t)});
      if(reversed&&/1x2|r[ée]sultat|double|vainqueur|dc/i.test(String(s.marche||"")))n.selection=swapCode(s.selection);
      final.push(n);
    }else if(COVERED_RE.test(s._c)&&!NOT_COVERED_RE.test(s._c)&&keysForComp(s._c,avail).length&&!failed){removed.push({match:s.match,why:"introuvable au calendrier ("+s._c+")"});}
    else final.push(Object.assign({},s,{verif:COVERED_RE.test(s._c)?"none":"na"}));
  }
  return{sels:final.map(clean),removed,checked:true};
}

function frComp(s){const t=String(s||"");for(const [re,r] of FR_COMP) if(re.test(t)) return r;return t.replace(/ - Spain/,"(Espagne)").replace(/ - Italy/," (Italie)").replace(/ - Germany/," (Allemagne)").replace(/ - France/," (France)").replace(/ - Portugal/," (Portugal)").replace(/ - England/," (Angleterre)");}
function parseJSON(raw){
  let t=raw.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
  const s=t.indexOf("{"),e=t.lastIndexOf("}"); if(s>=0&&e>s) t=t.slice(s,e+1);
  try{return JSON.parse(t);}catch(_){}
  try{return JSON.parse(t.replace(/,\s*([}\]])/g,"$1"));}catch(_){}
  try{
    let f=t.replace(/,\s*$/,""),o=0,b=0,inS=false;
    for(let i=0;i<f.length;i++){const c=f[i];if(c==='"'&&f[i-1]!=="\\")inS=!inS;if(!inS){if(c==="{")o++;if(c==="}")o--;if(c==="[")b++;if(c==="]")b--;}}
    while(b>0){f+="]";b--;}while(o>0){f+="}";o--;}
    return JSON.parse(f.replace(/,\s*([}\]])/g,"$1"));
  }catch(_){ throw new Error("Réponse IA illisible. Réessaie."); }
}

  ${live?"":`<div class="chips">${TF.map(t=>`<button class="chip ${st.tf===t.id?"on":""}" onclick="setTf('${t.id}')">${t.l}</button>`).join("")}</div>`}`;
}
function setMode(m){st.mode=m;afterFilter();}
function setTf(t){st.tf=t;afterFilter();}
function afterFilter(){const top=st.stack[st.stack.length-1];render();if(top&&top.v==="league"&&!LG[top.id].rng&&!LG[top.id].futures)loadLeague(top.id);}

  `<div class="search"><span>🔎</span><input id="q" placeholder="Rechercher un pays ou un championnat" value="${esc(st.q)}" oninput="st.q=this.value;document.getElementById('clist').innerHTML=champList()"/></div>
  <div id="clist" class="fade">${champList()}</div>

function champList(){
  const q=st.q.trim().toLowerCase();
  let h="";
  CATALOG.forEach(s=>{
    let rows="";
    if(s.items){
      s.items.filter(it=>!q||it.n.toLowerCase().includes(q)).forEach(it=>rows+=leagueRow(it.id));
    }
    if(s.countries){
      s.countries.forEach(c=>{
        const lm=c.leagues.filter(id=>!q||c.n.toLowerCase().includes(q)||LG[id].n.toLowerCase().includes(q));
        if(!lm.length) return;
        const open=st.open[c.id]||!!q;
        const tot=c.leagues.reduce((a,id)=>a+(counts[id+"_"+todayISO()]||0),0);
        rows+=`<div class="row" onclick="toggleCountry('${c.id}')"><span class="ic">${c.ic}</span><span class="nm">${esc(c.n)}<small>${c.leagues.length} compétition${c.leagues.length>1?"s":""}</small></span><span class="cnt">${tot||""}</span><span class="chev ${open?"open":""}">›</span></div>`;
        if(open) rows+=`<div class="sublist">${lm.map(id=>leagueRow(id,true)).join("")}</div>`;
      });
    }
    if(rows) h+=`<div class="sec">${s.sec}</div><div class="list">${rows}</div>`;
  });
  return h||`<div class="empty"><b>🔎</b>Aucun championnat trouvé</div>`;
}
function toggleCountry(id){st.open[id]=!st.open[id];document.getElementById("clist").innerHTML=champList();}
function toggleFav(id){
  if(favs.includes(id)){favs=favs.filter(x=>x!==id);toast("Retiré des favoris");}
  else{favs.push(id);toast("⭐ Ajouté aux favoris");}
  jSet("probet_favs",favs);
  const cl=document.getElementById("clist"); if(cl&&st.tab==="pop"&&!st.stack.length) cl.innerHTML=champList(); else render();
}
function openLeague(id){
  const L=LG[id];
  if(L.special){push({v:"special"});loadSpecial();return;}
  push({v:"league",id});
  if(!L.rng) loadLeague(id);
}

// ── Vue : Compétition (liste des matchs) ──────────────────────
function cacheKey(id){return id+"|"+(st.mode==="live"?"live":st.tf)+"|"+todayISO();}
function dayLabel(iso){
  const t=todayISO(),d=new Date();d.setDate(d.getDate()+1);const tm=localDay(d);
  const x=new Date(iso+"T12:00:00");const long=isNaN(x)?iso:x.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  return iso===t?"Aujourd'hui · "+long:iso===tm?"Demain · "+long:long.charAt(0).toUpperCase()+long.slice(1);
}
function viewLeague(id){
  const L=LG[id];
  if(L.rng){
    return header(esc(L.n),"",`<button class="star ${favs.includes(id)?"on":""}" onclick="toggleFav('${id}')">★</button>`)+

    <div style="font-family:var(--disp);font-size:20px;text-align:center;letter-spacing:1px;margin-bottom:8px">${L.rng==="virtual"?"MATCHS VIRTUELS":"ESPORTS"}</div>
    <div class="info">${L.rng==="virtual"?"Les matchs virtuels sont générés par un algorithme aléatoire : aucune statistique, aucune forme, aucune information ne permet de prévoir le résultat. Le bot les exclut volontairement de ses analyses.":"Les matchs eSports (FC 26) durent quelques minutes, s'enchaînent sans arrêt et ne sont presque pas couverts par des données fiables. Le bot ne peut pas les analyser sérieusement et les exclut de ses coupons."}</div>
    <div class="warn">Un bot stratégique gagne sur la durée en ne pariant que là où il a un avantage. Ici, il n'en a pas.</div></div>`;
  }

  let h=header(esc(L.n),esc(L.country?COUNTRY[L.country].n:"Compétition"),refresh)+(L.futures?"":filtersBar());
  if(busy[k]) return h+loader("🔍 "+engineName()+" cherche les matchs "+(live?"en direct":"à venir")+"...");

  const ms=data.matchs||[];
  if(!ms.length) return h+`<div class="empty"><b>${live?"📡":"📭"}</b>Aucun match ${live?"en direct":"trouvé pour ce filtre"}.<br>Essaie un autre créneau.</div>`;
  h+=`<div class="sub" style="margin:10px 2px">${ms.length} MATCH${ms.length>1?"S":""} · ${esc(data.at||"")}${data.src==="odds"?" · 📊 COTES RÉELLES":data.estim?" · COTES ESTIMÉES":""}</div><div class="fade">`;
  let lastDay=null;
  ms.forEach((m,i)=>{
    if(!m.minute&&m.date&&m.date!==lastDay){lastDay=m.date;h+=`<div class="dayhdr">📅 ${dayLabel(m.date)}</div>`;}
    const mk=matchKey(m.t1,m.t2);
    const inC=coupon.find(s=>s.mk===mk);
    const mm={...m,comp:L.full,lid:id};
    const ref="mem['"+k+"'].matchs["+i+"]";
    const ob=(lab,sel,cote)=>{const on=inC&&inC.marche==="Résultat (1X2)"&&inC.selection===sel;return`<button class="odd ${on?"sel":""}" onclick="event.stopPropagation();addSel({match:${ref}.t1+' vs '+${ref}.t2,t1:${ref}.t1,t2:${ref}.t2,comp:LG['${id}'].full,heure:${ref}.heure,date:${ref}.date,marche:'Résultat (1X2)',selection:'${sel}',cote:${num(cote)||0}})"><span>${lab}</span><b>${num(cote)?f2(num(cote)):"—"}</b></button>`;};
    h+=`<div class="mrow" onclick="openMatch('${k}',${i})">
      <div class="mtop"><span class="mtime ${m.minute?"mlive":""}">${m.minute?esc(m.minute)+"'":esc(m.heure||"--:--")}</span><div class="mteams">${esc(m.t1)}<br>${esc(m.t2)}</div>${m.score?`<div style="font-family:var(--disp);font-size:24px;color:var(--red)">${esc(m.score)}</div>`:""}<button class="ibtn" style="color:var(--green);border-color:rgba(0,229,160,.35);padding:0 9px" title="Ajouter au générateur" onclick="event.stopPropagation();addGenFrom('${k}',${i},'${id}')">🎯</button></div>
      ${m.date&&m.date!==todayISO()?`<div class="sub" style="margin:-4px 0 6px">${esc(m.date)}</div>`:""}
      <div class="odds">${ob("1","1",m.c1)}${ob("X","X",m.cx)}${ob("2","2",m.c2)}</div></div>`;
  });
  return h+`</div><div class="${data.src==="odds"?"info":"warn"}">${data.src==="odds"?"📊 Cotes réelles The Odds API ("+esc(oddsBk()==="best"?"meilleure cote":oddsBk()==="avg"?"moyenne":"1xBet")+"). Elles bougent : vérifie juste avant de parier."+(lsGet("probet_odds_left")?" · Crédits restants : "+esc(lsGet("probet_odds_left")):""):"Cotes "+(data.estim?"estimées par l'IA":"relevées sur le web")+" : indicatives. "+(oddsKey()?"Ce championnat n'est pas couvert par The Odds API.":"Ajoute une clé The Odds API dans Menu pour des cotes réelles.")+" Corrige-les dans le coupon avec celles de ton bookmaker."}</div>`;
}
const TF_TXT={all:"les prochains matchs à venir (dans les 7 prochains jours)","30m":"les matchs qui commencent dans les 30 prochaines minutes","1h":"les matchs qui commencent dans la prochaine heure","3h":"les matchs qui commencent dans les 3 prochaines heures",today:"tous les matchs d'aujourd'hui pas encore commencés",tomorrow:"tous les matchs de demain"};
async function loadLeague(id,force){
  const L=LG[id],k=cacheKey(id);
  if(busy[k]) return;
  const cached=jGet("probet_c_"+k,null);
  const ttl=st.mode==="live"?120000:1800000;
  if(!force&&cached&&Date.now()-cached.ts<ttl){mem[k]=cached.d;render();return;}
  busy[k]=true;render();
  try{
    let d;
    if(L.futures){
      const raw=await callAI(SYS_EXPERT,"Date et heure : "+nowTxt()+". Avec la recherche web, donne les cotes actuelles du marché 'vainqueur' pour : "+L.q+". 10 à 16 favoris, triés par cote croissante, avec probabilité implicite et avis court. JSON : {\"favoris\":[{\"equipe\":\"\",\"cote\":4.5,\"proba\":18,\"avis\":\"\"}]}",null,null,3);
      d=parseJSON(raw);
    }else{
      if(oddsKey()&&ODDS_MAP[id]){
        try{await ensureSports();const sk=sportKeyFor(id);if(sk) d=await loadOddsLeague(id,sk);}
        catch(ex){toast("📊 Cotes réelles indisponibles : passage à l'IA");console.warn(ex);st.oddsErr=ex.message;}
      }
    }
    if(!L.futures&&!d){
      const win=st.mode==="live"?"les matchs EN COURS en ce moment (en direct), avec score actuel et minute":TF_TXT[st.tf];
      const raw=await strictSearch(()=>callAI(SYS_EXPERT,"Date et heure actuelles : "+nowTxt()+" (fuseau "+tz()+"). Utilise la recherche web pour lister "+win+" de la compétition de football : "+L.q+". Heures dans le fuseau "+tz()+". Pour chaque match : équipes, date (AAAA-MM-JJ), heure (HH:MM), cotes 1/X/2 moyennes des bookmakers (si introuvables, estime-les de façon réaliste et mets estim:true), score et minute si en direct. Maximum 25 matchs, triés par heure. Si aucun match : matchs vide. JSON : {\"estim\":false,\"matchs\":[{\"t1\":\"\",\"t2\":\"\",\"date\":\"\",\"heure\":\"\",\"c1\":1.9,\"cx\":3.4,\"c2\":4.1,\"score\":null,\"minute\":null}]}",null,null,4));
      d=parseJSON(raw);
    }
    if(!L.futures){
      d.matchs=(d.matchs||[]).filter(m=>m&&m.t1&&m.t2);
      if(st.mode!=="live"){counts[id+"_"+todayISO()]=d.matchs.filter(m=>!m.date||m.date===todayISO()).length;jSet("probet_counts",counts);}
    }
    d.at=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    mem[k]=d; jSet("probet_c_"+k,{ts:Date.now(),d});
  }catch(ex){mem[k]={err:ex.message};}
  finally{busy[k]=false;render();}
}

// ── Vue : Match (analyse complète) ────────────────────────────
function openMatch(k,i){const m=mem[k].matchs[i];const L=LG[st.stack[st.stack.length-1].id];push({v:"match",m:{...m,comp:L.full}});}
function viewMatch(m){
  const mk=matchKey(m.t1,m.t2), a=mem["an_"+mk];
  const fav=favMatches.find(x=>x.mk===mk);
  let h=header(esc(m.t1)+" — "+esc(m.t2),esc(m.comp)+" · "+esc(m.date||"")+" "+esc(m.heure||""),`<button class="star ${fav?"on":""}" onclick="toggleFavMatch()">★</button>`);

  window._cm=base;
  h+=`<div class="card fade"><div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin-bottom:12px">

    ${num(m.o25)?`<div class="odds" style="grid-template-columns:1fr 1fr;margin-top:6px"><button class="odd" onclick="addSel({..._cm,marche:'Plus/Moins 2.5 buts',selection:'Plus de 2.5',cote:${num(m.o25)}})"><span>+2.5 BUTS</span><b>${f2(num(m.o25))}</b></button><button class="odd" onclick="addSel({..._cm,marche:'Plus/Moins 2.5 buts',selection:'Moins de 2.5',cote:${num(m.u25)}})"><span>-2.5 BUTS</span><b>${num(m.u25)?f2(num(m.u25)):"—"}</b></button></div>`:""}
    ${m.real?`<div class="sub" style="text-align:center;margin-top:8px;color:var(--green)">📊 COTES RÉELLES · ${esc(m.bk||"")}</div>`:`<div class="sub" style="text-align:center;margin-top:8px">Cotes indicatives (IA)</div>`}</div>`;
  h+=`<button class="btn ghost" style="margin-bottom:12px;color:var(--green);border-color:rgba(0,229,160,.35)" onclick="addGen(_cm)">🎯 Ajouter au générateur de coupons</button>`;
  if(busy["an_"+mk]) return h+loader("🧠 Analyse stratégique : forme, absences, stats, cotes...");
  if(!a) return h+`<button class="btn pur" onclick="analyseMatch()">🧠 ANALYSE COMPLÈTE DU BOT</button><div class="info" style="margin-top:12px">Le bot étudie la forme, les absences, les confrontations, les statistiques et les cotes, puis note chaque marché sur 20 et repère les paris à valeur.</div>`;
  if(a.err) return h+`<div class="err">⚠ ${esc(a.err)}</div><button class="btn pur" onclick="analyseMatch()">↻ RÉESSAYER</button>`;
  const bp=a.meilleur_pari;
  h+=`<div class="card fade">
    <div class="sub" style="color:var(--purple);margin-bottom:6px">🧠 SYNTHÈSE DU BOT</div>
    <div style="font-size:13px;color:#b8cfe0;line-height:1.6;margin-bottom:10px">${esc(a.resume||"")}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <div style="background:var(--card3);border-top:2px solid var(--green);border-radius:8px;padding:8px"><div class="sub">${esc(m.t1)}</div><div style="font-family:var(--mono);font-size:11px;margin-top:3px">${esc(a.forme_t1||"—")}</div>${(a.absents_t1||[]).length?`<div style="font-size:10px;color:#ff6b6b;margin-top:3px">🚑 ${esc(a.absents_t1.join(", "))}</div>`:""}</div>
      <div style="background:var(--card3);border-top:2px solid var(--red);border-radius:8px;padding:8px"><div class="sub">${esc(m.t2)}</div><div style="font-family:var(--mono);font-size:11px;margin-top:3px">${esc(a.forme_t2||"—")}</div>${(a.absents_t2||[]).length?`<div style="font-size:10px;color:#ff6b6b;margin-top:3px">🚑 ${esc(a.absents_t2.join(", "))}</div>`:""}</div>
    </div>
    ${a.h2h?`<div style="font-size:11px;color:var(--muted);margin-bottom:4px">⚔️ ${esc(a.h2h)}</div>`:""}
    ${a.score_probable?pill("Score probable : "+esc(a.score_probable),"#ffd600"):""}
  </div>`;
  if(bp&&bp.selection){
    h+=`<div class="card fade" style="border-color:rgba(0,229,160,.4);background:linear-gradient(135deg,rgba(0,229,160,.08),var(--card))"><div class="sub" style="color:var(--green)">💎 MEILLEUR PARI</div>${pickHTML(bp,"an_"+mk,"meilleur_pari",base)}</div>`;
  }
  h+=`<div class="sec">📊 TOUS LES MARCHÉS ANALYSÉS</div>`;
  (a.picks||[]).forEach((p,i)=>{h+=`<div class="fade">${pickHTML(p,"an_"+mk,"picks."+i,base)}</div>`;});

function pickHTML(p,memKey,path,base){
  const inC=coupon.find(s=>s.mk===matchKey(base.t1,base.t2)&&s.marche===p.marche&&s.selection===p.selection);
  return`<div class="pick"><div class="ptop"><div style="flex:1;min-width:0"><div class="pmk">${esc(fr(p.marche))}</div><div class="psel">${esc(fr(p.selection))} ${num(p.cote)?`<span style="font-size:15px;color:var(--yellow)">@${f2(num(p.cote))}</span>`:""}</div>
  <div>${num(p.proba)?pill("Proba "+num(p.proba)+"%","#00b4d8"):""}${num(p.value)?pill("Value "+f2(num(p.value)),num(p.value)>=1?"#00e5a0":"#ff4d6d"):""}</div>
  <div class="pwhy">${esc(p.raison||"")}</div>
  <button class="add ${inC?"done":""}" onclick="addFromPath('${memKey}','${path}')">${inC?"✓ Dans le coupon":"+ Ajouter au coupon"}</button></div>
  <div class="note" style="color:${nc(p.note)}">${num(p.note)||"—"}<small>/20</small></div></div></div>`;
}
function getPath(o,path){return path.split(".").reduce((a,k)=>a==null?a:a[k],o);}
function addFromPath(memKey,path){
  const p=getPath(mem[memKey],path); if(!p) return;
  const base=p.match?{match:p.match,t1:(p.match.split(" vs ")[0]||""),t2:(p.match.split(" vs ")[1]||""),comp:p.competition||"",heure:p.heure||"",date:p.date||""}:window._cm;
  addSel({...base,marche:p.marche,selection:p.selection,cote:num(p.cote),note:num(p.note),raison:p.raison||""});
}
async function analyseMatch(force){
  const m=st.stack[st.stack.length-1].m, mk=matchKey(m.t1,m.t2), k="an_"+mk;
  if(busy[k]) return;
  if(!force){const c=jGet("probet_c_"+k,null);if(c&&Date.now()-c.ts<3*3600000){mem[k]=c.d;render();return;}}

async function loadTesseract(){
  if(window.Tesseract) return;
  await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=()=>rej(new Error("Module OCR introuvable (connexion ?)"));document.head.appendChild(s);});
}
async function ocrFrames(frames){
  await loadTesseract();
  setPhotoMsg("🔤 Préparation de la lecture (OCR)...");
  const w=await Tesseract.createWorker("fra+eng");
  const seen=new Set(), out=[];
  try{
    for(let i=0;i<frames.length;i++){
      setPhotoMsg("🔤 Lecture image "+(i+1)+"/"+frames.length+"...");
      const r=await w.recognize(frames[i].preview);
      (r.data.text||"").split(/\n+/).map(x=>x.trim()).filter(x=>x.length>1).forEach(x=>{const k=x.toLowerCase().replace(/\s+/g," ");if(!seen.has(k)){seen.add(k);out.push(x);}});
    }
  }finally{await w.terminate();}
  return out.join("\n");
}

function frameSig(cv){const s=document.createElement("canvas");s.width=24;s.height=40;const x=s.getContext("2d");x.drawImage(cv,0,0,24,40);const d=x.getImageData(0,0,24,40).data;const g=[];for(let i=0;i<d.length;i+=4)g.push((d[i]+d[i+1]+d[i+2])/3);return g;}
function sigDiff(a,b){let t=0;for(let i=0;i<a.length;i++)t+=Math.abs(a[i]-b[i]);return t/a.length;}
async function extractFrames(file,maxKeep){
  const url=URL.createObjectURL(file);
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.src=url;
  const once=(ev,ms)=>new Promise((res,rej)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;res(false);}},ms);v.addEventListener(ev,()=>{if(!done){done=true;clearTimeout(t);res(true);}},{once:true});v.addEventListener("error",()=>{if(!done){done=true;clearTimeout(t);rej(new Error("Vidéo illisible par ce navigateur. Essaie une capture d'écran, ou une vidéo MP4."));}},{once:true});});
  try{
    v.load();await once("loadedmetadata",15000);await once("loadeddata",8000);
    let dur=v.duration;
    if(!isFinite(dur)||dur<=0){v.currentTime=1e6;await once("seeked",5000);dur=v.currentTime||10;}
    const W=Math.min(720,v.videoWidth||720), H=Math.round(W*(v.videoHeight||1280)/(v.videoWidth||720));
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
    const step=Math.max(0.6,Math.min(2,dur/40)), times=[];
    for(let t=0.15;t<dur;t+=step) times.push(t);
    if(!times.length) times.push(0);
    const kept=[];let last=null;
    for(let i=0;i<times.length;i++){
      setPhotoMsg("🎬 Extraction des images "+Math.round((i+1)/times.length*100)+"%...");
      v.currentTime=Math.min(times[i],dur-0.05);await once("seeked",4000);
      ctx.drawImage(v,0,0,W,H);
      const sg=frameSig(cv);
      if(!last||sigDiff(sg,last)>7){const du=cv.toDataURL("image/jpeg",0.72);kept.push({b64:du.split(",")[1],mime:"image/jpeg",preview:du});last=sg;}
    }
    let frames=kept;
    if(frames.length>maxKeep){const out=[];for(let i=0;i<maxKeep;i++)out.push(frames[Math.round(i*(frames.length-1)/(maxKeep-1))]);frames=out;}
    if(!frames.length) throw new Error("Aucune image exploitable dans la vidéo.");
    return frames;
  }finally{URL.revokeObjectURL(url);}
}
async function handleFile(e){
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  const name=file.name.toLowerCase();
  const isPDF=file.type==="application/pdf"||name.endsWith(".pdf");
  const isVid=file.type.startsWith("video/")||/\.(mp4|mov|m4v|webm|3gp)$/.test(name);
  if(!isPDF&&!isVid&&!file.type.startsWith("image/")){toast("Utilise une vidéo, JPG, PNG, WebP ou PDF");return;}
  st.photoErr="";st.cv="verify";verifyRes=null;
  busy.photo=true;busy.photoMsg=isVid?"🎬 Ouverture de la vidéo...":"📄 Lecture...";render();
  try{
    if(isVid){
      const frames=await extractFrames(file,usesOCR()?8:10);
      photoFile={name:file.name,frames,preview:frames[0].preview,isVideo:true};
    }else if(isPDF){
      if(!window.pdfjsLib){
        await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
        window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      const frames=[];
      for(let pg=1;pg<=Math.min(pdf.numPages,4);pg++){
        const p1=await pdf.getPage(pg); const w1=p1.getViewport({scale:1}).width; const vp=p1.getViewport({scale:Math.min(1.5,1400/w1)});
        const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
        const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
        await p1.render({canvasContext:ctx,viewport:vp}).promise;
        const du=cv.toDataURL("image/jpeg",0.72);frames.push({b64:du.split(",")[1],mime:"image/jpeg",preview:du});
      }
      photoFile={name:file.name,frames,preview:frames[0].preview};
    }else{
      const du=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);});
      photoFile={name:file.name,frames:[{b64:du.split(",")[1],mime:file.type,preview:du}],preview:du};
    }
  }catch(ex){st.photoErr="Lecture impossible : "+ex.message;photoFile=null;}
  finally{busy.photo=false;busy.photoMsg="";render();}
}

    <div><div class="sub">RÉUSSITE</div><div style="font-family:var(--disp);font-size:26px;color:${done.length&&won.length/done.length>=.5?"var(--green)":"var(--yellow)"}">${done.length?Math.round(won.length/done.length*100)+"%":"—"}</div></div>
    <div><div class="sub">BILAN</div><div style="font-family:var(--disp);font-size:26px;color:${gainT-misT>=0?"var(--green)":"var(--red)"}">${misT?(gainT-misT>=0?"+":"")+f2(gainT-misT):"—"}</div></div></div>`;
  hist.forEach((x,i)=>{
    const s=STATUTS[x.statut];
    h+=`<div class="card"><div class="ptop"><div><div class="sub">${new Date(x.date).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${x.sels.length} sél.${x.note?" · "+x.note+"/20":""}</div>${x.titre?`<div style="font-family:var(--mono);font-size:10px;color:var(--green);margin-top:2px">${esc(x.titre)}</div>`:""}<div style="font-family:var(--disp);font-size:22px;margin-top:2px">COTE ${f2(x.cote)}${x.mise?` <span style="font-size:14px;color:var(--muted)">· mise ${x.mise}</span>`:""}</div></div>
      <button onclick="cycleStatut(${i})" style="border:1px solid ${s[1]}55;background:${s[1]}15;color:${s[1]};border-radius:20px;padding:5px 10px;font-family:var(--mono);font-size:10px;flex-shrink:0">${s[0]}</button></div>
      <div style="margin-top:8px">${x.sels.map(z=>`<div style="font-size:12px;color:var(--muted);padding:3px 0;border-bottom:1px dashed #12304a">• ${esc(z.match)} — <span style="color:var(--text)">${esc(z.marche)} : ${esc(z.selection)}</span>${num(z.cote)?" @"+f2(num(z.cote)):""}</div>`).join("")}</div>
      <div style="display:flex;gap:6px;margin-top:9px"><button class="add" onclick="reloadHist(${i})">🎫 Recharger</button><button class="add" onclick="copyCoupon(hist[${i}].sels,'Coupon')">📋 Copier</button><button class="add" style="color:#ff4d6d;border-color:rgba(255,77,109,.3);background:rgba(255,77,109,.08)" onclick="delHist(${i})">🗑</button></div></div>`;
  });
  return h+`<div class="info">💡 Marque tes coupons Gagné/Perdu (touche le statut) pour suivre ta réussite réelle et voir quelle stratégie marche le mieux.</div>`;
}
function cycleStatut(i){const o=["attente","gagne","perdu"];hist[i].statut=o[(o.indexOf(hist[i].statut)+1)%3];jSet("probet_history",hist);render();}
function delHist(i){if(!confirm("Supprimer ce coupon de l'historique ?"))return;hist.splice(i,1);jSet("probet_history",hist);render();}
function reloadHist(i){coupon=JSON.parse(JSON.stringify(hist[i].sels));couponAnalysis=null;saveCoupon();goTab("coupon");toast("🎫 Coupon rechargé");}

function saveKey(){
  const v=(document.getElementById("key-in").value||"").trim();
  if(!v){toast("Colle ta clé API");return;}
  if(!lsSet(KEY_STORES[getProvider()],v)){toast("Impossible d'enregistrer (mode privé ?)");return;}
  st.editKey=false;render();toast("🔑 Clé enregistrée");
}
function saveOddsKey(){const v=(document.getElementById("odds-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(ODDS_KEY,v);st.editOdds=false;clearCache();testOdds();}
async function testOdds(){st.oddsMsg="Test en cours...";st.oddsOk=true;render();
  try{const k=await ensureSports(true);st.oddsOk=true;st.oddsMsg="✓ Clé valide : "+k.length+" compétitions de football disponibles.";}
  catch(ex){st.oddsOk=false;st.oddsMsg=(ex.message==="Failed to fetch"?"Connexion à The Odds API impossible depuis ce site (réseau ou blocage navigateur).":ex.message);}
  render();}
function saveTvKey(){const v=(document.getElementById("tv-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(TAVILY_KEY,v);st.editTv=false;testTavily();}
async function testTavily(){st.tvMsg="Test en cours...";st.tvOk=true;render();
  try{const j=await tavilySearch("Premier League prochains matchs",2);st.tvOk=true;st.tvMsg="✓ Tavily répond ("+((j.results||[]).length)+" résultats) : "+String(j.answer||((j.results||[])[0]||{}).title||"").slice(0,70);}
  catch(ex){st.tvOk=false;st.tvMsg=ex.message;}
  render();}
function saveCbKey(){const v=(document.getElementById("cb-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(CEREBRAS_KEY,v);st.editCb=false;testCerebras();}
async function testCerebras(){st.cbMsg="Test en cours...";st.cbOk=true;render();
  try{const t=await callCerebras("Réponds en un mot.","Dis OK",200);st.cbOk=true;st.cbMsg="✓ Cerebras répond : "+t.slice(0,40);}
  catch(ex){st.cbOk=false;st.cbMsg=(ex.message==="Failed to fetch"?"Connexion impossible depuis ce site (blocage du navigateur ou réseau). PROBET continuera avec Groq seul.":ex.message);}
  render();}
function clearCache(){
  try{Object.keys(localStorage).filter(k=>k.startsWith("probet_c_")).forEach(k=>localStorage.removeItem(k));}catch(_){}
  mem={};counts={};jSet("probet_counts",counts);toast("♻️ Cache vidé");
}

(function cleanOldCache(){try{const t=todayISO();Object.keys(localStorage).filter(k=>k.startsWith("probet_c_")&&!k.includes(t)&&!k.includes("an_")).forEach(k=>localStorage.removeItem(k));}catch(_){}})();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
render();
async function autoDayCoupon(){
  try{
    if(!genCfg.autoDay||busy.gen) return;
    if(!IS_CLAUDE&&!getKey()) return;
    const t=todayISO();
    if(lsGet("probet_auto_day")===t) return;
    lsSet("probet_auto_day",t);
    const keep={src:genCfg.src,when:genCfg.when};
    genCfg.src="auto";genCfg.when="today";st.genNew=false;
    setCv("gen");toast("🌅 Coupon du jour : le bot le prépare tout seul...");
    try{await runGen();}finally{genCfg.src=keep.src;genCfg.when=keep.when;}
    if(genRes&&!genRes.err){genRes.auto=true;genRes.day=t;jSet("probet_gen_result",genRes);toast("✅ Ton coupon du jour est prêt");}
    render();
  }catch(ex){console.warn(ex);}
}
setTimeout(autoDayCoupon,900);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(autoDayCoupon,500);});
if(!IS_CLAUDE&&!getKey()) setTimeout(()=>toast("🔑 Commence par ajouter ta clé API dans Menu"),600);
