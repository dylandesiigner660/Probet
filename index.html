<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PROBET"/>
<meta name="theme-color" content="#0b1226"/>
<title>PROBET — Bot Stratégique Football</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b1226;--card:#131d3b;--card2:#131d3b;--card3:#0f1831;--border:#24345f;--border2:#2c3e70;--green:#2bd67b;--blue:#5ab0ff;--red:#ff5c70;--yellow:#ffc845;--purple:#9d8cff;--orange:#ff8a4c;--text:#eaeefa;--muted:#8c99c2;--dim:#5d6a96;--mono:'Plus Jakarta Sans',system-ui,sans-serif;--disp:'Big Shoulders Display','Plus Jakarta Sans',sans-serif;--card:#131d3b;--card2:#16224a;--card3:#0f1831;--border:#24345f;--border2:#2c3e70;--text:#eaeefa;--muted:#8c99c2;--dim:#5d6a96;--gold:#ffc845;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overscroll-behavior:none}
body{background:linear-gradient(160deg,#0b1226,#0b1226,#0b1226);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer}
input,select,textarea{background:var(--card2);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;width:100%;outline:none;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
input::placeholder,textarea::placeholder{color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;padding:0;background:transparent!important;border:none!important}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#2bd67b,#5ab0ff)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #2bd67b;margin-top:-8px}input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#2bd67b,#5ab0ff)}input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #2bd67b}
label{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
#app{max-width:520px;margin:0 auto;padding:0 12px}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1226 80%,rgba(11,18,38,0));padding:12px 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--disp);font-size:30px;letter-spacing:3px;line-height:1;background:linear-gradient(135deg,#2bd67b,#5ab0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ttl{font-family:var(--disp);font-size:24px;letter-spacing:1.5px;line-height:1.05;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;flex-shrink:0}
.ibtn{height:34px;padding:0 10px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;flex-shrink:0}
.eng{display:inline-flex;align-items:center;gap:5px;background:rgba(43,214,123,.08);border:1px solid rgba(43,214,123,.2);padding:5px 10px;border-radius:20px;font-family:var(--mono);font-size:9px;color:var(--green);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin:8px 0}
.seg button{padding:9px 4px;border:none;border-radius:9px;background:transparent;color:var(--dim);font-family:var(--mono);font-size:11px}
.seg button.on{background:linear-gradient(135deg,var(--green),var(--blue));color:#000;font-weight:700}
.seg button.live.on{background:linear-gradient(135deg,#ff5c70,#c9184a);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;white-space:nowrap}
.chip.on{background:rgba(90,176,255,.15);border-color:var(--blue);color:#fff}
.chip.ong{background:rgba(43,214,123,.14);border-color:var(--green);color:var(--green)}
.sec{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:2px;margin:16px 2px 8px}
.list{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid #1a2647;cursor:pointer;min-height:50px}
.row:last-child{border-bottom:none}
.row:active{background:#1a2650}
.row .ic{width:28px;height:28px;border-radius:8px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.row .nm small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);font-weight:400;margin-top:2px}
.cnt{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px;text-align:right}
.star{background:none;border:none;font-size:18px;color:#3a4a7a;padding:2px 2px 2px 6px;line-height:1}
.star.on{color:var(--yellow)}
.chev{color:var(--dim);font-size:12px;transition:transform .2s;width:14px;text-align:center}
.chev.open{transform:rotate(90deg)}
.sublist{background:var(--card3);border-bottom:1px solid #1a2647}
.sublist .row{padding-left:26px;min-height:44px}
.sublist .row .nm{font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.mrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.mtop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mtime{font-family:var(--mono);font-size:10px;color:var(--blue);background:rgba(90,176,255,.08);border:1px solid rgba(90,176,255,.2);border-radius:6px;padding:2px 7px;flex-shrink:0}
.mlive{color:#fff;background:var(--red);border-color:var(--red)}
.mteams{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.odd{background:var(--card3);border:1px solid var(--border2);border-radius:9px;padding:7px 4px;text-align:center;color:var(--text)}
.odd span{display:block;font-family:var(--mono);font-size:9px;color:var(--dim)}
.odd b{font-family:var(--disp);font-size:18px;letter-spacing:.5px}
.odd.sel{border-color:var(--green);background:rgba(43,214,123,.12)}
.btn{width:100%;padding:14px;border:none;border-radius:13px;font-family:var(--disp);font-size:20px;letter-spacing:1.5px;color:#000;background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 4px 22px rgba(43,214,123,.22)}
.btn.pur{background:linear-gradient(135deg,#9d8cff,#6c5ce7);color:#fff;box-shadow:0 4px 22px rgba(157,140,255,.25)}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);box-shadow:none;font-size:16px;padding:11px}
.btn:disabled{opacity:.5}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:20px;display:inline-block;margin:2px 2px 2px 0;border:1px solid}
.load{text-align:center;padding:26px 10px}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 10px}
.lmsg{font-family:var(--mono);font-size:10px;color:var(--green);animation:shimmer 1.5s ease-in-out infinite}
.err{background:rgba(255,92,112,.08);border:1px solid rgba(255,92,112,.25);border-radius:10px;padding:11px 13px;color:#ff8394;font-family:var(--mono);font-size:11px;line-height:1.6;margin-bottom:12px;word-break:break-word}
.info{background:rgba(90,176,255,.06);border:1px solid rgba(90,176,255,.18);border-radius:10px;padding:10px 12px;color:#a6b1d6;font-size:12px;line-height:1.6;margin-bottom:12px}
.warn{background:rgba(255,200,69,.05);border:1px solid rgba(255,200,69,.15);border-radius:10px;padding:10px 12px;color:#b8a347;font-size:11px;line-height:1.6;margin:12px 0}
.empty{text-align:center;padding:50px 20px;color:var(--dim);font-family:var(--mono);font-size:11px;line-height:1.8}
.empty b{display:block;font-size:34px;margin-bottom:8px}
.pick{background:var(--card3);border:1px solid var(--border2);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pmk{font-family:var(--mono);font-size:9px;color:var(--blue)}
.psel{font-family:var(--disp);font-size:19px;letter-spacing:.5px;line-height:1.1;margin-top:2px}
.pwhy{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:5px}
.note{font-family:var(--disp);font-size:22px;line-height:1;text-align:center;min-width:48px}
.note small{display:block;font-family:var(--mono);font-size:8px;color:var(--dim)}
.add{border:1px solid rgba(43,214,123,.35);background:rgba(43,214,123,.1);color:var(--green);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:10px;margin-top:7px}
.add.done{border-color:var(--border2);background:transparent;color:var(--dim)}
.ticket-h{background:linear-gradient(135deg,#2bd67b,#5ab0ff);border-radius:14px 14px 0 0;padding:13px 15px;color:#000;display:flex;justify-content:space-between;align-items:center}
.ticket-b{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:4px 14px 14px}
.tsel{padding:11px 0;border-bottom:1px dashed #22305a}
.tsel:last-child{border-bottom:none}
.codd{width:72px;text-align:center;font-family:var(--disp);font-size:18px;padding:6px 4px}
.x{background:rgba(255,92,112,.1);border:1px solid rgba(255,92,112,.25);color:#ff5c70;border-radius:8px;width:30px;height:30px;font-size:13px;flex-shrink:0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.kv b{font-family:var(--disp);font-size:22px;color:var(--text);letter-spacing:.5px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,20,42,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bn button{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:9px;padding:4px 0;position:relative}
nav.bn button .i{font-size:20px;line-height:1}
nav.bn button.on{color:var(--green)}
nav.bn .cbtn .i{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(43,214,123,.4);border:3px solid var(--bg)}
nav.bn .cbtn.on{color:var(--green)}
.nbadge{position:absolute;top:-24px;right:calc(50% - 32px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1a2650;border:1px solid var(--green);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.search{position:relative;margin:4px 0 6px}
.search input{padding-left:34px}
.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeup .3s ease}

/* ── Version ordinateur (écrans larges) ── */
.desk-only,.side-logo{display:none}
@media (min-width:1024px){
  body{padding-bottom:30px;padding-left:230px}
  #app{max-width:1180px;padding:0 28px}
  nav.bn{left:0;top:0;bottom:0;right:auto;width:230px;border-top:none;border-right:1px solid var(--border);padding:22px 14px}
  nav.bn .in{max-width:none;display:flex;flex-direction:column;align-items:stretch;gap:6px}
  nav.bn .side-logo{display:block;font-family:var(--disp);font-size:30px;letter-spacing:3px;color:var(--green);padding:0 10px 18px;text-shadow:0 0 18px rgba(43,214,123,.35)}
  nav.bn .side-logo small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);margin-top:2px}
  nav.bn button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:13px;padding:12px 14px;border-radius:12px;font-family:inherit;font-weight:600;text-align:left}
  nav.bn button:hover{background:rgba(43,214,123,.06);color:var(--text)}
  nav.bn button.on{background:rgba(43,214,123,.1);color:var(--green)}
  nav.bn .cbtn .i{width:auto;height:auto;margin:0;border:none;box-shadow:none;background:none;font-size:20px}
  .nbadge{position:static;margin-left:auto;border:none}
  #toast{bottom:30px;left:calc(50% + 115px)}
  .desk-only{display:block}
  .list{display:grid;grid-template-columns:1fr 1fr}
  .list .row{border-right:1px solid var(--border)}
  .gcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
  .gcol-b{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
  .gcol-b #gen-res{display:none}
  .card:hover,.list .row:hover,.mrow:hover{border-color:rgba(43,214,123,.28)}
  .row,.mrow,.chip,.btn{cursor:pointer}
}
@media (min-width:1500px){#app{max-width:1320px}}
.dayhdr{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin:14px 2px 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ══ v45 · Design « nuit de match » ══ */
html,body{font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(130% 55% at 50% -12%,#1b2c63 0%,rgba(27,44,99,0) 62%),radial-gradient(80% 40% at 100% 100%,rgba(43,214,123,.07),transparent 70%),#0b1226;background-attachment:fixed;-webkit-user-select:none;user-select:none}
input,textarea,.pwhy,.selectable{-webkit-user-select:text;user-select:text}
input,select,textarea{background:#0f1831;border-color:var(--border);border-radius:14px;padding:12px 14px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(43,214,123,.15)}
label{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:none;color:var(--muted)}
.sub{font-size:11px;letter-spacing:.2px;font-weight:500;color:var(--muted)}
.hdr{background:rgba(11,18,38,.72);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);margin:0 -12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.logo{font-family:var(--disp);font-weight:900;font-size:27px;letter-spacing:1.5px;background:none;-webkit-text-fill-color:#fff;color:#fff}
.brand{display:flex;align-items:center;gap:8px}
.ttl{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:.3px}
.back{border-radius:12px;background:var(--card2);border-color:var(--border2);font-size:22px}
.ibtn{border-radius:12px;font-size:11px;font-weight:600;background:var(--card2)}
.eng{font-size:10px;font-weight:700;letter-spacing:.4px;background:rgba(43,214,123,.1);border-color:rgba(43,214,123,.25);padding:6px 11px}
.seg{background:#0f1831;border:1px solid var(--border);border-radius:16px;padding:4px;gap:4px}
.seg button{border-radius:12px;font-size:11.5px;font-weight:700;letter-spacing:.2px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:#eaeefa;color:#0b1226;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.chip{border-radius:999px;font-size:12px;font-weight:600;padding:8px 14px;background:var(--card);transition:all .15s}
.chip.on{background:rgba(90,176,255,.16);border-color:#5ab0ff;color:#fff}
.chip.ong{background:rgba(43,214,123,.15)}
.sec{font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--muted);margin:20px 4px 8px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),var(--card);border-color:var(--border);border-radius:var(--r);padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 28px -12px rgba(2,6,20,.6)}
.list{border-radius:var(--r);background:var(--card)}
.row{min-height:56px;border-bottom-color:rgba(255,255,255,.05)}
.row .ic{width:34px;height:34px;border-radius:11px;background:#1a2650;font-size:17px}
.row .nm{font-size:15px}
.row .nm small{font-size:11px;font-weight:500;color:var(--muted)}
.mrow{border-radius:16px}
.btn{border-radius:16px;font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.6px;padding:15px;color:#062014;background:linear-gradient(135deg,#2bd67b,#38c7c0);box-shadow:0 10px 26px -10px rgba(43,214,123,.55),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s}
.btn.ghost{color:var(--text);border-color:var(--border2);background:rgba(255,255,255,.02);font-size:17px}
.btn:active,.chip:active,.add:active,.row:active,.ibtn:active,.seg button:active{transform:scale(.97)}
.add{border-radius:11px;font-size:11.5px;font-weight:700;padding:7px 11px}
.pill{font-size:10.5px;font-weight:600;padding:3px 9px}
.psel{font-family:var(--disp);font-weight:800;font-size:22px}
.note{font-family:var(--disp);font-weight:800}
.note small{font-size:9px}
.ticket-h{border-radius:var(--r) var(--r) 0 0;position:relative;overflow:hidden}
.ticket-h:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:14px;background:radial-gradient(circle at 7px 7px,#0b1226 5px,transparent 5.5px) 0 0/14px 14px repeat-x}
.ticket-b{border-radius:0 0 var(--r) var(--r);padding-top:10px}
.tsel{border-bottom-color:rgba(255,255,255,.07)}
.kv{font-size:12px}
.err{border-radius:14px;font-family:var(--mono);font-size:12.5px;font-weight:500}
.info,.warn{border-radius:14px;font-size:12.5px}
.empty{font-family:var(--mono);font-size:13px}
.lmsg{font-size:12.5px;font-weight:600;color:#c5cce6;animation:none;margin-top:6px}
.load{padding:30px 10px}
.load .bot{margin:0 auto}
.ldots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.ldots i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:ld 1s infinite ease-in-out}
.ldots i:nth-child(2){animation-delay:.15s;background:#5ab0ff}.ldots i:nth-child(3){animation-delay:.3s;background:var(--gold)}
@keyframes ld{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
/* mascotte */
.bot{display:block;flex-shrink:0;overflow:visible}
.bot .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.bot .ant{transform-box:fill-box;transform-origin:bottom center;animation:wob 4s ease-in-out infinite}

<script>
window.addEventListener("load",()=>setTimeout(()=>{const sp=document.getElementById("splash");if(sp){sp.classList.add("out");setTimeout(()=>sp.remove(),600);}},700));
// ═══════════════════════════════════════════════════════════════
// PROBET v12 — Bot stratégique football
// Aucune clé API n'est écrite dans ce fichier : elles sont saisies
// dans Menu et stockées uniquement dans le navigateur.
// ═══════════════════════════════════════════════════════════════

// ── Stockage local ─────────────────────────────────────────────
function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(_){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(_){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(_){} }
function jGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(_){ return d; } }
function jSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }

// ── Moteurs IA ────────────────────────────────────────────────
const IS_CLAUDE = location.hostname.includes("claude.ai") || location.hostname.includes("anthropic.com") || location.protocol==="blob:";
const PROV_STORE="probet_provider";
const KEY_STORES={claude:"probet_claude_key",groq:"probet_groq_key"};
const CEREBRAS_KEY="probet_cerebras_key";
const PROVIDERS={
  claude:{name:"Claude",model:"claude-sonnet-5-5",tag:"CLAUDE SONNET 5.5 · WEB",color:"#9d8cff",ph:"sk-ant-..."},
  groq:{name:"Groq",model:"openai/gpt-oss-120b",tag:"GROQ GPT-OSS 120B · WEB · GRATUIT",color:"#ff8a4c",ph:"gsk_..."}
};
function getProvider(){ const p=lsGet(PROV_STORE); return PROVIDERS[p]?p:"groq"; }
function getKey(p){ return lsGet(KEY_STORES[p||getProvider()]); }
function engineName(){ return IS_CLAUDE?"Claude":PROVIDERS[getProvider()].name; }

function needKey(){
  setTimeout(()=>{ goTab("menu"); toast("🔑 Ajoute ta clé API "+engineName()+" dans le Menu"); },50);
  return new Error("Clé API "+engineName()+" manquante. Ajoute-la dans Menu.");
}

async function callClaude(sys,usr,imgB64,imgMime,maxSearch,maxTok){
  const content=[];
  if(Array.isArray(imgB64)) imgB64.slice(0,12).forEach(im=>content.push({type:"image",source:{type:"base64",media_type:im.mime,data:im.b64}}));
  else if(imgB64&&imgMime) content.push({type:"image",source:{type:"base64",media_type:imgMime,data:imgB64}});
  content.push({type:"text",text:usr});
  const headers={"Content-Type":"application/json"};
  const body={model:IS_CLAUDE?"claude-sonnet-4-20250514":PROVIDERS.claude.model,max_tokens:maxTok||8000,messages:[{role:"user",content}]};
  if(sys) body.system=sys;
  if(!IS_CLAUDE){
    const key=getKey("claude"); if(!key) throw needKey();
    headers["x-api-key"]=key; headers["anthropic-version"]="2023-06-01"; headers["anthropic-dangerous-direct-browser-access"]="true";
    if(maxSearch) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:maxSearch}];
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||"Claude API "+res.status); }
  const d=await res.json();
  const t=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!t) throw new Error("Claude : réponse vide. Réessaie.");
  return t;
}
async function callGroq(sys,usr,imgB64,imgMime,maxTok,maxSearch){
  const key=getKey("groq"); if(!key) throw needKey();
  if(imgB64) throw new Error("Groq ne lit pas les images. Colle le texte du coupon, ou passe sur Claude dans Menu.");
  const messages=[]; if(sys) messages.push({role:"system",content:sys}); messages.push({role:"user",content:usr});
  // Modes essayés dans l'ordre : recherche obligatoire → recherche facultative → sans recherche
  const modes=maxSearch===0?["none"]:st.strictSearch?["required","required"]:maxSearch===1?["auto","none"]:["required","auto","none"];
  let lastErr;
  for(const mode of modes){
    const extra=mode==="none"?{}:{tools:[{type:"browser_search"}],tool_choice:mode};
    const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:PROVIDERS.groq.model,messages,temperature:0.3,max_completion_tokens:Math.min(maxTok||8000,8000),reasoning_effort:"low",...extra})});
    if(!res.ok){
      const e=await res.json().catch(()=>({}));const msg=e?.error?.message||("Groq "+res.status);
      if(/tool choice|did not call a tool|tool_use_failed|tool call|browser_search|failed to call/i.test(msg)){lastErr=new Error(msg);continue;}
      throw new Error(msg+(res.status===429||res.status===413?" — Limite gratuite Groq atteinte : attends une minute, ou réduis le nombre de matchs/coupons.":""));
    }
    const d=await res.json();
    const t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
    if(t) return t;
    lastErr=new Error("Groq : réponse vide (limite de longueur ou quota). Réessaie dans un instant.");
  }
  if(st.strictSearch) throw new Error("Recherche web impossible pour le moment : le bot préfère ne rien proposer plutôt qu'inventer des matchs. Réessaie dans une minute.");
  throw lastErr||new Error("Groq : pas de réponse");
}
// maxSearch : nombre max de recherches web (Claude). 0 = pas de recherche.
// ── Moteur personnalisé (revendeur compatible OpenAI ou Anthropic, ex. codecraftapi.com) ──
const CU_URL="probet_cu_url",CU_KEY="probet_cu_key",CU_MODEL="probet_cu_model",CU_FMT="probet_cu_fmt",CU_ON="probet_cu_on";
function cuBase(){return String(lsGet(CU_URL)||"https://codecraftapi.com/v1").trim().replace(/\/+$/,"");}
function useCustom(){return !IS_CLAUDE&&!!lsGet(CU_KEY)&&!!lsGet(CU_MODEL)&&lsGet(CU_ON)!=="0";}
async function cuFetch(path,opt){
  try{return await fetch(cuBase()+path,opt);}
  catch(ex){throw new Error("Moteur personnalisé injoignable depuis ce navigateur ("+ex.message+"). Il bloque peut-être les appels directs : dis-le à Claude pour passer par le relais Cloudflare.");}
}
async function callCustom(sys,usr,maxTok){
  const key=lsGet(CU_KEY),model=lsGet(CU_MODEL);if(!key||!model)throw new Error("Moteur personnalisé non configuré");
  const fmt=lsGet(CU_FMT)||"openai";
  const tryOpenAI=async()=>{const messages=[];if(sys)messages.push({role:"system",content:sys});messages.push({role:"user",content:usr});
    const r=await cuFetch("/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model,messages,temperature:0.3,max_tokens:Math.min(maxTok||8000,16000)})});
    return r;};
  const tryAnth=async()=>{const body={model,max_tokens:Math.min(maxTok||8000,16000),messages:[{role:"user",content:usr}]};if(sys)body.system=sys;
    return await cuFetch("/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"Authorization":"Bearer "+key,"anthropic-version":"2023-06-01"},body:JSON.stringify(body)});};
  let r=fmt==="anthropic"?await tryAnth():await tryOpenAI();
  if(!r.ok&&(r.status===404||r.status===405)){const alt=fmt==="anthropic"?"openai":"anthropic";r=alt==="anthropic"?await tryAnth():await tryOpenAI();if(r.ok)lsSet(CU_FMT,alt);}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=(d.error&&(d.error.message||d.error))||d.message||d.detail||("erreur "+r.status);throw new Error("Moteur personnalisé : "+(r.status===401||r.status===403?"clé refusée":r.status===402?"crédit épuisé":r.status===429?"limite atteinte, réessaie dans un instant":String(m).slice(0,160)));}
  let t="";
  if(d.choices&&d.choices[0])t=(d.choices[0].message&&d.choices[0].message.content)||d.choices[0].text||"";
  else if(Array.isArray(d.content))t=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  t=String(t||"").trim();if(!t)throw new Error("Moteur personnalisé : réponse vide");
  return t;
}
async function cuModels(){
  const key=lsGet(CU_KEY);const r=await cuFetch("/models",{headers:{"Authorization":"Bearer "+key,"x-api-key":key,"anthropic-version":"2023-06-01"}});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error("Liste des modèles : "+((d.error&&d.error.message)||d.message||r.status));
  return (d.data||d.models||[]).map(m=>m.id||m.name||m).filter(Boolean);
}
async function callCerebras(sys,usr,maxTok){
  const key=lsGet(CEREBRAS_KEY); if(!key) throw new Error("Clé Cerebras manquante");
  const messages=[]; if(sys) messages.push({role:"system",content:sys}); messages.push({role:"user",content:usr});
  const res=await fetch("https://api.cerebras.ai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-oss-120b",messages,temperature:0.3,reasoning_effort:"low",max_completion_tokens:Math.min(maxTok||8000,16000)})});
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error("Cerebras : "+(e?.message||e?.error?.message||res.status)); }
  const d=await res.json();
  const t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
  if(!t) throw new Error("Cerebras : réponse vide");
  lsSet("probet_cerebras_ok","1");
  return t;
}
const TAVILY_KEY="probet_tavily_key";
function tavilyKey(){if(IS_CLAUDE)return "";const off=+lsGet("probet_tv_off")||0;if(off&&Date.now()<off&&!st.tvForce)return "";return lsGet(TAVILY_KEY);}
async function tavilySearch(q,max){
  const key=tavilyKey();if(!key)throw new Error("Pas de clé Tavily");
  let r;
  try{r=await fetch("https://api.tavily.com/search",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({query:q,search_depth:"basic",max_results:max||5,include_answer:true})});}
  catch(ex){throw new Error("Tavily injoignable depuis ce navigateur ("+ex.message+")");}
  let j={};try{j=await r.json();}catch(_){}
  if(!r.ok){const d=j.detail;const m=(d&&(d.error||d.message||(typeof d==="string"?d:"")))||j.error||j.message||("erreur "+r.status);
    if(r.status===432||r.status===433||(r.status===429&&/credit|plan|usage|limit/i.test(String(m))))lsSet("probet_tv_off",String(Date.now()+24*3600000));
    throw new Error("Tavily : "+(r.status===401?"clé invalide":(r.status===429||r.status===432||r.status===433)?"limite ou crédits du mois épuisés (Tavily mis en pause 24 h : le bot utilise la recherche Groq à la place)":m));}
  return j;
}
function tvText(j,lim){const t=(j.answer?"Résumé : "+j.answer+" | ":"")+(j.results||[]).map(x=>(x.title||"")+" : "+String(x.content||"").replace(/\s+/g," ")).join(" | ");return t.slice(0,lim||700);}
async function tavilyMatch(m,lim){
  const ck="probet_c_tv_"+todayISO()+"_"+matchKey(m.t1,m.t2)+"_"+(lim||700);

  const n=all.length,sp=all.reduce((m,a)=>m+a.c,0),sr=all.filter(a=>a.w).length*100;

  return{n,B,f};
}

function apifPick(list,want,maxTier){
  const byL={};list.filter(f=>f.tier<=(maxTier||2)).forEach(f=>{(byL[f.lid]=byL[f.lid]||[]).push(f);});
  const order=Object.keys(byL).sort((a,b)=>byL[a][0].tier-byL[b][0].tier);const picked=[];
  while(picked.length<want&&order.some(k=>byL[k].length)){for(const k of order){if(byL[k].length&&picked.length<want)picked.push(byL[k].shift());}}
  if(picked.length<want&&(maxTier||2)<3) return apifPick(list,want,3);
  return picked;
}
async function verifyFixtures(sels,opt){
  opt=opt||{};
  const out=[],removed=[];const teamsSeen=[];
  for(const s of sels){
    const [t1,t2]=String(s.match||"").split(/\s+vs\.?\s+|\s+-\s+|\s+–\s+/i);
    const dup=[t1,t2].find(t=>t&&teamsSeen.some(x=>sameTeam(x,t)));
    if(dup){removed.push({match:s.match,why:"équipe présente deux fois ("+dup.trim()+")"});continue;}
    if(opt.only&&!opt.only.some(m=>(sameTeam(t1,m.t1)&&sameTeam(t2||"",m.t2))||(sameTeam(t1,m.t2)&&sameTeam(t2||"",m.t1)))){
      // nom d'équipe légèrement différent : on rattache au bon match au lieu de supprimer
      const mm=opt.only.find(m=>sameTeam(t1,m.t1)||sameTeam(t2||"",m.t2)||sameTeam(t1,m.t2)||sameTeam(t2||"",m.t1));
      if(mm&&!teamsSeen.some(x=>sameTeam(x,mm.t1)||sameTeam(x,mm.t2))){const sw=sameTeam(t1,mm.t2)||sameTeam(t2||"",mm.t1);const s2=Object.assign({},s,{match:mm.t1+" vs "+mm.t2,competition:s.competition||mm.comp,heure:s.heure||mm.heure});if(sw&&/1x2|r[ée]sultat|double|vainqueur|dc|victoire/i.test(String(s.marche||"")))s2.selection=swapCode(s.selection);teamsSeen.push(mm.t1,mm.t2);out.push(Object.assign({},s2,{_t1:mm.t1,_t2:mm.t2,_c:String(s2.competition||s2.comp||"")}));continue;}
      removed.push({match:s.match,why:"ne fait pas partie des matchs étudiés"});continue;}
    teamsSeen.push(t1,t2);out.push(Object.assign({},s,{_t1:t1,_t2:t2||"",_c:String(s.competition||s.comp||"")}));
  }
  const clean=x=>{const y=Object.assign({},x);delete y._t1;delete y._t2;delete y._c;return y;};
  // API-Football d'abord si disponible (couvre presque tout)
  let apool=null;
  if(apifKey()){try{const d0=Date.now();const first=opt.day||localDay(d0);apool=await apifDay(first);
    const miss=out.some(s=>!apool.some(f=>(sameTeam(s._t1,f.t1)&&sameTeam(s._t2,f.t2))||(sameTeam(s._t1,f.t2)&&sameTeam(s._t2,f.t1))));
    if(miss&&!opt.day){const nx=localDay(d0+86400000);try{apool=apool.concat(await apifDay(nx));}catch(_){}}}catch(ex){console.warn(ex);apool=null;}}
  const findA=s=>apool&&apool.find(f=>(sameTeam(s._t1,f.t1)&&sameTeam(s._t2,f.t2))||(sameTeam(s._t1,f.t2)&&sameTeam(s._t2,f.t1)));
  const okA=(s,f)=>{const reversed=sameTeam(s._t1,f.t2)&&!sameTeam(s._t1,f.t1);const t=new Date(f.ts);const n=Object.assign({},s,{verif:"ok",match:f.t1+" vs "+f.t2,competition:f.league+" ("+frCountry(f.country)+")",heure:t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),date:localDay(t)});if(reversed&&/1x2|r[ée]sultat|double|vainqueur|dc|victoire/i.test(String(s.marche||"")))n.selection=swapCode(s.selection);return n;};
  if(!oddsKey()){
    if(!apool){out.forEach(s=>s.verif="none");return{sels:out.map(clean),removed,checked:false};}
    const fin=[];for(const s of out){const f=findA(s);
      if(f){if(opt.day&&localDay(f.ts)!==opt.day){removed.push({match:s.match,why:"ne se joue pas ce jour-là (prévu le "+new Date(f.ts).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+")"});continue;}fin.push(okA(s,f));}
      else fin.push(Object.assign({},s,{verif:"na"}));}
    return{sels:fin.map(clean),removed,checked:true};
  }
  let avail;try{avail=await allSoccerKeys();}catch(ex){out.forEach(s=>s.verif="none");return{sels:out.map(clean),removed,checked:false};}
  const find=(ev,s)=>ev.find(e=>(sameTeam(s._t1,e.home_team)&&sameTeam(s._t2,e.away_team))||(sameTeam(s._t1,e.away_team)&&sameTeam(s._t2,e.home_team)));
  // 1) championnats probables d'abord, 2) tout le reste si besoin
  const first=[];out.forEach(s=>keysForComp(s._c,avail).forEach(k=>{if(!first.includes(k))first.push(k);}));
  let pool=(await eventsFor(first)).ev;let failed=0;
  if(out.some(s=>!find(pool,s)&&!findA(s))){const rest=avail.filter(k=>!first.includes(k));const r=await eventsFor(rest,(i,n)=>{if(typeof setGenMsg==="function")setGenMsg("✅ Vérification au calendrier "+i+"/"+n+"...");});pool=pool.concat(r.ev);failed=r.failed;}
  failed+=first.filter(k=>evByKey[k]&&!evByKey[k].ok).length;
  const final=[];
  for(const s of out){
    const e=find(pool,s);
    if(e){
      if(opt.day&&localDay(e.commence_time)!==opt.day){removed.push({match:s.match,why:"ne se joue pas ce jour-là (prévu le "+new Date(e.commence_time).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+")"});continue;}
      const reversed=sameTeam(s._t1,e.away_team)&&!sameTeam(s._t1,e.home_team);
      const t=new Date(e.commence_time);
      const n=Object.assign({},s,{verif:"ok",match:e.home_team+" vs "+e.away_team,competition:frComp(e.sport_title)||s._c,heure:t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),date:localDay(t)});
      if(reversed&&/1x2|r[ée]sultat|double|vainqueur|dc/i.test(String(s.marche||"")))n.selection=swapCode(s.selection);
      final.push(n);
    }else if(findA(s)){const f=findA(s);
      if(opt.day&&localDay(f.ts)!==opt.day){removed.push({match:s.match,why:"ne se joue pas ce jour-là (prévu le "+new Date(f.ts).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+")"});continue;}
      final.push(okA(s,f));
    }else if(!apool&&COVERED_RE.test(s._c)&&!NOT_COVERED_RE.test(s._c)&&keysForComp(s._c,avail).length&&!failed){removed.push({match:s.match,why:"introuvable au calendrier ("+s._c+")"});}
    else final.push(Object.assign({},s,{verif:COVERED_RE.test(s._c)?"none":"na"}));
  }
  return{sels:final.map(clean),removed,checked:true};
}

function fr(s){let t=String(s==null?"":s);FR_TERMS.forEach(([re,r])=>{t=t.replace(re,r);});return t.replace(/\b(R[ée]sultat|Double chance|Plus de|Moins de)\s+\1\b/gi,"$1");}
const FR_COMP=[[/uefa europa conference league|europa conference league|conference league/i,"Ligue Conférence"],[/uefa europa league|europa league/i,"Ligue Europa"],[/uefa champions league|champions league/i,"Ligue des champions"],[/uefa nations league/i,"Ligue des nations"],[/^epl$|english premier league/i,"Premier League (Angleterre)"],[/efl championship|^championship$/i,"Championship (Angleterre)"],[/la liga - spain|^la liga$/i,"Liga (Espagne)"],[/la liga 2 - spain|segunda/i,"Liga 2 (Espagne)"],[/serie a - italy|^serie a$/i,"Serie A (Italie)"],[/serie b - italy/i,"Serie B (Italie)"],[/bundesliga - germany|^bundesliga$/i,"Bundesliga (Allemagne)"],[/bundesliga 2/i,"2. Bundesliga (Allemagne)"],[/ligue 1 - france|^ligue 1$/i,"Ligue 1 (France)"],[/ligue 2 - france/i,"Ligue 2 (France)"],[/primeira liga - portugal|primeira liga/i,"Liga Portugal"],[/dutch eredivisie|eredivisie/i,"Eredivisie (Pays-Bas)"],[/turkey super league|super lig/i,"Süper Lig (Turquie)"],[/belgium first div/i,"Pro League (Belgique)"],[/scottish premiership/i,"Premiership (Écosse)"],[/brazil s[ée]rie a|campeonato brasileiro/i,"Série A (Brésil)"],[/^mls$/i,"MLS (États-Unis)"],[/saudi pro league|saudi arabia/i,"Saudi Pro League"],[/fa cup/i,"FA Cup"],[/copa libertadores/i,"Copa Libertadores"]];
function frComp(s){const t=String(s||"");for(const [re,r] of FR_COMP) if(re.test(t)) return r;return t.replace(/ - Spain/,"(Espagne)").replace(/ - Italy/," (Italie)").replace(/ - Germany/," (Allemagne)").replace(/ - France/," (France)").replace(/ - Portugal/," (Portugal)").replace(/ - England/," (Angleterre)");}
function parseJSON(raw){
  let t=raw.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
  const s=t.indexOf("{"),e=t.lastIndexOf("}"); if(s>=0&&e>s) t=t.slice(s,e+1);
  try{return JSON.parse(t);}catch(_){}
  try{return JSON.parse(t.replace(/,\s*([}\]])/g,"$1"));}catch(_){}
  try{
    let f=t.replace(/,\s*$/,""),o=0,b=0,inS=false;
    for(let i=0;i<f.length;i++){const c=f[i];if(c==='"'&&f[i-1]!=="\\")inS=!inS;if(!inS){if(c==="{")o++;if(c==="}")o--;if(c==="[")b++;if(c==="]")b--;}}
    while(b>0){f+="]";b--;}while(o>0){f+="}";o--;}
    return JSON.parse(f.replace(/,\s*([}\]])/g,"$1"));

function champList(){

const apifHits=[];
function apifHitsLoad(){try{const a=JSON.parse(localStorage.getItem("probet_apif_hits")||"[]");const now=Date.now();a.filter(t=>now-t<60000&&!apifHits.includes(t)).forEach(t=>apifHits.push(t));apifHits.sort((x,y)=>x-y);}catch(_){}}
function apifHitsSave(){try{localStorage.setItem("probet_apif_hits",JSON.stringify(apifHits.filter(t=>Date.now()-t<60000)));}catch(_){}}
async function apifGet(path,retry){
  // Offre gratuite : 10 requêtes/minute → on s'impose 8/minute
  for(;;){apifHitsLoad();const now=Date.now();while(apifHits.length&&now-apifHits[0]>60000)apifHits.shift();
    if(apifHits.length<8)break;const w=Math.ceil((60000-(now-apifHits[0]))/1000)+1;
    if(typeof setGenMsg==="function")setGenMsg("⏳ Limite API-Football (10/min) : reprise dans "+w+" s...");
    if(typeof setChatMsg==="function")try{setChatMsg("⏳ Limite API-Football : reprise dans "+w+" s…");}catch(_){}
    st.apifWait=w;await sleep(Math.min(w,5)*1000);}
  st.apifWait=0;apifHits.push(Date.now());apifHitsSave();
  try{return await apifGet0(path);}
  catch(ex){if(!retry&&/too many requests|per minute/i.test(ex.message)){apifHits.length=0;for(let i=0;i<8;i++)apifHits.push(Date.now()+i);apifHitsSave();if(typeof setGenMsg==="function")setGenMsg("⏳ Limite API-Football atteinte : nouvel essai dans 60 s...");st.apifWait=60;try{render();}catch(_){}await sleep(61000);st.apifWait=0;return apifGet(path,true);}
    if(/too many requests|per minute/i.test(ex.message))throw new Error("API-Football refuse encore après 1 minute d'attente. Ferme les autres pages PROBET ouvertes (index, index2, indexPC), attends 2 minutes puis teste une seule fois. Si ça continue, regarde sur dashboard.api-football.com si ton quota du jour (100) est atteint.");
    if(/request limit|requests per day|daily/i.test(ex.message))throw new Error("Quota du jour API-Football épuisé (100 requêtes). Il se réinitialise demain.");
    throw ex;}
}
async function apifGet0(path){
  const px=String(lsGet(APIF_PROXY)||"").trim().replace(/\/+$/,"");
  let r;try{r=px?await fetch(px+path):await fetch("https://v3.football.api-sports.io"+path,{headers:{"x-apisports-key":lsGet(APIF_KEY)}});}
  catch(ex){throw new Error(px?"Le relais ne répond pas ("+ex.message+").":"API-Football refuse les appels directs : configure le relais dans ☰ Menu.");}
  let j={};try{j=await r.json();}catch(_){}
  const errs=j.errors&&!Array.isArray(j.errors)?Object.values(j.errors).join(" "):"";
  if(!r.ok||errs) throw new Error("API-Football : "+(errs||("erreur "+r.status)));
  return j.response||[];
}

async function aiRetry(sys,usr,maxSearch,maxTok){
  for(let k=0;;k++){
    try{return await callAI(sys,usr,null,null,maxSearch,maxTok);}
    catch(ex){
      if(k<3&&/limite|rate|429|413|quota|tokens per minute|too large|réponse vide/i.test(ex.message)){
        const w=k===0?25:40;for(let t=w;t>0;t--){setGenMsg("⏳ Limite gratuite Groq : reprise dans "+t+" s (essai "+(k+2)+"/4)...");await sleep(1000);}

  }
}

function trackAdd(sels,src){
  const now=new Date().toISOString();
  (sels||[]).forEach(x=>{if(!x||!x.match)return;const k=String(x.match).toLowerCase()+"|"+String(x.marche||"").toLowerCase()+"|"+String(x.selection||"").toLowerCase();
    if(track.some(t=>t.k===k))return;
    track.unshift({k,match:x.match,comp:x.competition||x.comp||"",marche:x.marche||"",selection:x.selection||"",cote:num(x.cote)||0,conf:num(x.confiance)||0,date:x.date||todayISO(),heure:x.heure||"",src:src||"gen",at:now});});
  track=track.slice(0,500);jSet("probet_track",track);
}

  if(/deux [ée]quipes|btts/.test(m))return "Les deux équipes marquent "+(/non|no/.test(sl)?"NON":"OUI");
  if(/mi-temps.*moins|1re mi-temps|ht_under/.test(m))return "Moins de 1.5 but 1re mi-temps";
  if(/gagne au moins|win_half|une mi-temps/.test(m))return "Gagne au moins une mi-temps";
  if(/total individuel|total [a-z]|marque|team_total/.test(m)&&!/^total de buts/.test(m))return "Total individuel";

function lineOf(t){const m=String(t).match(/(\d+[.,]5)/);return m?parseFloat(m[1].replace(",",".")):null;}

function evalSel(x,h,a,hh,ha){

  if(/deux [ée]quipes|btts/.test(m)){const b=h>0&&a>0;return no?!b:yes?b:null;}
  if(/1re mi-temps|mi-temps.*moins|ht_under/.test(m)){if(hh==null)return null;const L=lineOf(both)||1.5;return (hh+ha)<L;}

  if(/total individuel|total [a-zà-ÿ]|marque/.test(m)&&!/^total( de)? buts/.test(m)){const L=lineOf(both)||0.5;const isT2=(x.t2&&both.includes(String(x.t2).toLowerCase().split(" ")[0]))||/\b2\b|ext/.test(sl);const g=isT2?a:h;const under=/moins/.test(both);return under?g<L:g>L;}

  if(/moins de|under/.test(both)&&!/corner|carton|faute|tir/.test(m)){const L=lineOf(both);if(L==null)return null;return tot<L;}

  return null;
}

  if(idx.length>=7)t.push({id:"grosse",l:"🔴 GROSSE COTE (audace)",mise:10,idx:idx.slice(0,12)});
  return t.filter((x,k)=>x.idx.length>=2&&!(k>0&&x.idx.length===t[k-1].idx.length));

async function loadTesseract(){
  if(window.Tesseract) return;
  await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=()=>rej(new Error("Module OCR introuvable (connexion ?)"));document.head.appendChild(s);});
}
async function ocrFrames(frames){
  await loadTesseract();
  setPhotoMsg("🔤 Préparation de la lecture (OCR)...");
  const w=await Tesseract.createWorker("fra+eng");
  const seen=new Set(), out=[];
  try{
    for(let i=0;i<frames.length;i++){
      setPhotoMsg("🔤 Lecture image "+(i+1)+"/"+frames.length+"...");
      const r=await w.recognize(frames[i].preview);
      (r.data.text||"").split(/\n+/).map(x=>x.trim()).filter(x=>x.length>1).forEach(x=>{const k=x.toLowerCase().replace(/\s+/g," ");if(!seen.has(k)){seen.add(k);out.push(x);}});
    }
  }finally{await w.terminate();}
  return out.join("\n");
}
function parseBetPdf(items){
  if(!items||!items.length) return [];
  const hdr=re=>items.find(i=>re.test(i.s));
  const hS=hdr(/^s[ée]lectio/i),hC=hdr(/^cote$/i),hE=hdr(/^[ée]v[ée]nement|^match/i);
  const cS=hS?hS.x-0.015:0.48, cO=hC?hC.x-0.008:0.59, cE=0.19;
  const col=i=>i.x<cE?"d":i.x<cS?"e":i.x<cO?"s":"o";
  const FOOT=/XOF|FCFA|\btax\b|vers[ée]|return|cote totale|^total|gain|mise|pot\./i;
  const dates=items.filter(i=>col(i)==="d"&&/^\d{1,2}[.\/]\d{1,2}(\s+\d{1,2}:\d{2})?$/.test(i.s.trim())).sort((a,b)=>a.y-b.y);
  if(!dates.length) return [];
  const blocks=dates.map(d=>({y:d.y,date:d.s.trim(),e:[],s:[],o:null,a:null}));
  const near=y=>blocks.reduce((b,x)=>Math.abs(x.y-y)<Math.abs(b.y-y)?x:b,blocks[0]);
  items.forEach(i=>{const c=col(i);const t=i.s.trim();if(!t)return;
    if(c==="d"){if(/^\d{1,2}:\d{2}$/.test(t)){const b=near(i.y);if(Math.abs(b.y-i.y)<16&&!/:/.test(b.date))b.date+=" "+t;}return;}
    if(c==="o"){if(/^\d+([.,]\d+)?$/.test(t)){const b=near(i.y);if(Math.abs(b.y-i.y)<16&&b.o==null)b.o=parseFloat(t.replace(",","."));}return;}
    if(FOOT.test(t)) return;
    if(c==="s"){if(i.y<blocks[0].y-90||(hS&&Math.floor(i.y/10000)===Math.floor(hS.y/10000)&&i.y<=hS.y+18))return;near(i.y).s.push(i);return;}
  });
  // événements : ancrés sur le numéro "123456 :" (sinon rattachés au bloc le plus proche)
  const ev=items.filter(i=>col(i)==="e"&&i.s.trim()&&!FOOT.test(i.s)).sort((a,b)=>a.y-b.y||a.x-b.x);
  const anchors=ev.filter(i=>/^\d{4,9}\s*:/.test(i.s.trim()));
  if(anchors.length){
    anchors.forEach(a=>{const b=near(a.y);if(!b.a)b.a=a;});
    const as=blocks.filter(b=>b.a).sort((p,q)=>p.a.y-q.a.y);
    ev.forEach(i=>{let b=null;for(const x of as){if(x.a.y<=i.y+2)b=x;else break;}if(b&&i.y-b.a.y<160)b.e.push(i);});
  }else ev.forEach(i=>{const b=near(i.y);if(Math.abs(b.y-i.y)<70)b.e.push(i);});
  const join=arr=>arr.sort((a,b)=>a.y-b.y||a.x-b.x).map(i=>i.s.trim()).join(" ").replace(/\s+/g," ").replace(/([A-Za-zÀ-ÿ])- (?=[A-Za-zÀ-ÿ])/g,"$1-").trim();
  const out=[];
  blocks.forEach(b=>{
    let e=join(b.e).replace(/^\d{4,9}\s*:\s*/,"").replace(/^(football|soccer)\s*\.\s*/i,"");
    let sel=join(b.s);if(!e||!sel)return;
    let k=e.lastIndexOf(" - ");let sep=3;if(k<0){k=e.search(/\s+vs\.?\s+/i);sep=(e.slice(k).match(/^\s+vs\.?\s+/i)||[""])[0].length;}
    if(k<0)return;
    const left=e.slice(0,k).trim(),t2=e.slice(k+sep).trim().replace(/\.$/,"");
    const segs=left.split(/\.\s+/);let t1=segs.pop();
    while(segs.length&&segs[segs.length-1].length<=3)t1=segs.pop()+". "+t1;
    const comp=segs.join(". ").replace(/\.$/,"");
    let marche="",selection=sel;const j=sel.lastIndexOf(" - ");
    if(j>0){marche=sel.slice(0,j).trim();selection=sel.slice(j+3).trim();}
    else if(/^(v1|v2|w1|w2|1|2|x)$/i.test(sel))marche="Résultat 1X2";
    else if(/^(1x|x2|12)$/i.test(sel))marche="Double chance";
    const dm=b.date.match(/^(\d{1,2})[.\/](\d{1,2})(?:\s+(\d{1,2}:\d{2}))?/);
    out.push({match:t1+" vs "+t2,t1,t2,competition:comp,jour:dm?dm[1].padStart(2,"0")+"/"+dm[2].padStart(2,"0"):"",heure:dm&&dm[3]?dm[3].padStart(5,"0"):"",marche,selection,cote:b.o});
  });
  return out;
}

function pdfLines(items){
  const g={};items.forEach(i=>{const k=Math.round(i.y/4);(g[k]=g[k]||[]).push(i);});
  return Object.keys(g).sort((a,b)=>a-b).map(k=>g[k].sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join("  ")).join("\n");
}
function jourISO(j){const m=String(j||"").match(/(\d{1,2})[\/.](\d{1,2})/);if(!m)return null;const n=new Date();let y=n.getFullYear();
  let d=new Date(y,+m[2]-1,+m[1]);if(d-n>120*86400000)d=new Date(y-1,+m[2]-1,+m[1]);return localDay(d);}
// Statut réel de chaque sélection via API-Football (scores officiels, sans IA)
async function verifyScores(ext){
  if(!apifKey()) return 0;
  const days=[...new Set(ext.map(p=>jourISO(p.jour)).filter(Boolean))].sort().slice(0,7);
  const pool={};
  for(const d of days){try{setPhotoMsg("⚽ Scores officiels du "+d.split("-").reverse().slice(0,2).join("/")+"...");pool[d]=await apifDay(d,d>=localDay(Date.now()-86400000));}catch(ex){console.warn(ex);if(/quota|limite|Trop/i.test(ex.message))break;}}
  let n=0;
  ext.forEach(p=>{const L=pool[jourISO(p.jour)];if(!L)return;const [a,b]=[p.t1,p.t2];
    const f=L.find(f=>(sameTeam(a,f.t1)&&sameTeam(b,f.t2))||(sameTeam(a,f.t2)&&sameTeam(b,f.t1)));
    if(!f)return;const rev=sameTeam(a,f.t2)&&!sameTeam(a,f.t1);
    const h=rev?f.ga:f.gh,g=rev?f.gh:f.ga,hh=f.hh==null?null:(rev?f.ha:f.hh),ha=f.hh==null?null:(rev?f.hh:f.ha);
    if(/NS|TBD/.test(f.st)){p.apiStatut="A_VENIR";return;}
    if(/PST|CANC|ABD|AWD|WO/.test(f.st)){p.apiStatut="INCONNU";p.apiNote="match reporté/annulé";return;}
    if(h==null)return;p.score=h+"-"+g;
    if(/FT|AET|PEN/.test(f.st)){const r=evalSel(p,h,g,hh,ha);if(r===true||r===false){p.apiStatut=r?"GAGNE":"PERDU";p.resSrc="apif";n++;}}
    else{p.apiStatut="EN_COURS";p.resSrc="apif";}
  });
  return n;
}
function extLine(p,i){return "#"+(i+1)+" | "+(p.jour||"")+" "+(p.heure||"")+" | "+(p.competition||"")+" | "+p.match+" | "+(p.marche?p.marche+" : ":"")+p.selection+(num(p.cote)?" @"+num(p.cote):"")+(p.apiStatut?" | RÉSULTAT OFFICIEL : "+p.apiStatut+(p.score?" "+p.score:""):p.statut&&p.statut!=="INCONNU"?" | statut visible : "+p.statut+(p.score?" "+p.score:""):"");}

    const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
    const step=Math.max(0.6,Math.min(2,dur/40)), times=[];
    for(let t=0.15;t<dur;t+=step) times.push(t);
    if(!times.length) times.push(0);
    const kept=[];let last=null;
    for(let i=0;i<times.length;i++){
      setPhotoMsg("🎬 Extraction des images "+Math.round((i+1)/times.length*100)+"%...");
      v.currentTime=Math.min(times[i],dur-0.05);await once("seeked",4000);
      ctx.drawImage(v,0,0,W,H);
      const sg=frameSig(cv);
      if(!last||sigDiff(sg,last)>7){const du=cv.toDataURL("image/jpeg",0.72);kept.push({b64:du.split(",")[1],mime:"image/jpeg",preview:du});last=sg;}
    }
    let frames=kept;
    if(frames.length>maxKeep){const out=[];for(let i=0;i<maxKeep;i++)out.push(frames[Math.round(i*(frames.length-1)/(maxKeep-1))]);frames=out;}

}
async function handleFile(e){
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  const name=file.name.toLowerCase();
  const isPDF=file.type==="application/pdf"||name.endsWith(".pdf");
  const isVid=file.type.startsWith("video/")||/\.(mp4|mov|m4v|webm|3gp)$/.test(name);
  if(!isPDF&&!isVid&&!file.type.startsWith("image/")){toast("Utilise une vidéo, JPG, PNG, WebP ou PDF");return;}
  st.photoErr="";st.cv="verify";verifyRes=null;
  busy.photo=true;busy.photoMsg=isVid?"🎬 Ouverture de la vidéo...":"📄 Lecture...";render();
  try{
    if(isVid){
      const frames=await extractFrames(file,usesOCR()?8:10);
      photoFile={name:file.name,frames,preview:frames[0].preview,isVideo:true};
    }else if(isPDF){
      if(!window.pdfjsLib){
        await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
        window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      const items=[];
      for(let pg=1;pg<=Math.min(pdf.numPages,40);pg++){
        busy.photoMsg="📄 Lecture du texte page "+pg+"/"+pdf.numPages+"...";const lm=document.querySelector(".lmsg");if(lm)lm.textContent=busy.photoMsg;
        const p0=await pdf.getPage(pg);const v0=p0.getViewport({scale:1});const tc=await p0.getTextContent();
        tc.items.forEach(it=>{if(it.str&&it.str.trim())items.push({x:it.transform[4]/v0.width,y:(pg-1)*10000+(v0.height-it.transform[5]),s:it.str});});
      }
      let pdfSels=[];try{pdfSels=parseBetPdf(items);}catch(ex){console.warn(ex);}
      const pdfText=pdfLines(items);
      const frames=[];
      for(let pg=1;pg<=Math.min(pdf.numPages,4);pg++){
        const p1=await pdf.getPage(pg); const w1=p1.getViewport({scale:1}).width; const vp=p1.getViewport({scale:Math.min(1.5,1400/w1)});
        const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
        const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
        await p1.render({canvasContext:ctx,viewport:vp}).promise;
        const du=cv.toDataURL("image/jpeg",0.72);frames.push({b64:du.split(",")[1],mime:"image/jpeg",preview:du});
      }
      photoFile={name:file.name,frames,preview:frames[0].preview,pdfSels,pdfText,pages:pdf.numPages};
    }else{
      const du=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);});
      photoFile={name:file.name,frames:[{b64:du.split(",")[1],mime:file.type,preview:du}],preview:du};
    }
  }catch(ex){st.photoErr="Lecture impossible : "+ex.message;photoFile=null;}
  finally{busy.photo=false;busy.photoMsg="";render();}
}

function couponText(sels,title){
  const ne=k=>k===10?"🔟":String(k).split("").map(d=>d+"\uFE0F\u20E3").join("");
  let t="🎯 PROBET — "+(title||"Coupon")+" · "+(sels||[]).length+" sélection"+((sels||[]).length>1?"s":"")+"\n📅 "+new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+"\n\n";
  (sels||[]).forEach((s,i)=>{t+=ne(i+1)+" "+s.match+(s.heure?" ("+s.heure+")":"")+"\n   ➜ "+fr(s.marche)+" : "+fr(s.selection)+(num(s.cote)?" @"+f2(num(s.cote)):"")+"\n";});
  t+="\n💰 Cote totale : "+f2(totalOdds(sels))+"\n⚠️ Jouez responsablement";
  return t;
}
function copyCoupon(sels,title){copyText(couponText(sels,title));}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("📋 Copié ! Colle-le dans Telegram");}

}

  h+=`<div class="sec">⚙️ DONNÉES</div><div class="list">
    <div class="row" onclick="exportData()"><span class="ic">💾</span><span class="nm">Sauvegarder mes données<small>Historique, réglages, bilan, liste noire (sans les clés API)</small></span></div>
    <div class="row" onclick="document.getElementById('imp-in').click()"><span class="ic">📥</span><span class="nm">Restaurer une sauvegarde<small>Après un changement de téléphone ou un cache vidé</small></span></div>
    <input type="file" id="imp-in" accept="application/json,.json" style="display:none" onchange="importData(event)"/>
    <div class="row" onclick="clearCache()"><span class="ic">♻️</span><span class="nm">Vider le cache des matchs<small>Force le rechargement des données</small></span></div>
    <div class="row" onclick="if(confirm('Effacer favoris, coupon, historique et réglages ? (les clés API sont conservées)')){['probet_favs','probet_fav_matches','probet_coupon','probet_history','probet_counts','probet_gencfg','probet_gen_matches','probet_gen_result','probet_verify_result','probet_chat','probet_lessons','probet_mise','probet_auto_day'].forEach(lsDel);location.reload();}"><span class="ic">🗑</span><span class="nm" style="color:#ff8394">Tout réinitialiser<small>Favoris, coupon, historique</small></span></div>
  </div>
  <div class="sec">🧭 COMMENT FONCTIONNE LE BOT</div><div class="card" style="font-size:12.5px;color:#aab4d8;line-height:1.7">
    1. <b>Recherche</b> : il trouve les vrais matchs via la recherche web.<br>
    2. <b>Analyse</b> : forme, absences, confrontations, stats, enjeu.<br>
    3. <b>Valeur</b> : il compare sa probabilité à la cote (value = proba × cote).<br>
    4. <b>Filtre</b> : il rejette les paris notés sous 14/20 et les virtuels aléatoires.<br>
    5. <b>Coupon</b> : une seule sélection par match, sans corrélation.</div>
  <div class="sec">🛡️ JEU RESPONSABLE</div><div class="card" style="font-size:12.5px;color:#aab4d8;line-height:1.7">
    • Aucune prédiction n'est garantie : le football reste imprévisible.<br>

    • Les cotes affichées sont indicatives : vérifie-les sur ton bookmaker.</div>
  <div style="text-align:center;font-family:var(--mono);font-size:8px;color:#2a3966;letter-spacing:1px;padding:20px 0">PROBET v46.0 · BOT STRATÉGIQUE FOOTBALL</div>`;
  return h;
}
function saveKey(){
  const v=(document.getElementById("key-in").value||"").trim();
  if(!v){toast("Colle ta clé API");return;}
  if(!lsSet(KEY_STORES[getProvider()],v)){toast("Impossible d'enregistrer (mode privé ?)");return;}
  st.editKey=false;render();toast("🔑 Clé enregistrée");
}
function saveOddsKey(){const v=(document.getElementById("odds-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(ODDS_KEY,v);st.editOdds=false;clearCache();testOdds();}
async function testOdds(){st.oddsMsg="Test en cours...";st.oddsOk=true;render();
  try{const k=await ensureSports(true);st.oddsOk=true;st.oddsMsg="✓ Clé valide : "+k.length+" compétitions de football disponibles.";}
  catch(ex){st.oddsOk=false;st.oddsMsg=(ex.message==="Failed to fetch"?"Connexion à The Odds API impossible depuis ce site (réseau ou blocage navigateur).":ex.message);}
  render();}
function savePxUrl(){let v=(document.getElementById("px-in").value||"").trim();if(!v){toast("Colle l'adresse du relais");return;}if(!/^https:\/\//.test(v))v="https://"+v;lsSet(APIF_PROXY,v);st.editPx=false;testApif();}
function saveAfKey(){const v=(document.getElementById("af-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(APIF_KEY,v);st.editAf=false;testApif();}
async function testApif(){st.afMsg="Test en cours...";st.afOk=true;render();
  try{delete apifMem[todayISO()];try{localStorage.removeItem("probet_c_apif_"+todayISO());}catch(_){}
    const l=await apifDay(todayISO());const c=new Set(l.map(f=>f.country)).size;const lg=new Set(l.map(f=>f.lid)).size;
    st.afOk=l.length>0;st.afMsg=l.length?"✓ "+l.length+" matchs aujourd'hui dans "+lg+" compétitions et "+c+" pays.":"La clé répond mais aucun match n'est renvoyé pour aujourd'hui (l'offre gratuite ne couvre peut-être pas la saison en cours).";}
  catch(ex){st.afOk=false;st.afMsg=ex.message;}
  render();}
async function saveCu(){const u=(document.getElementById("cu-url").value||"").trim();if(u)lsSet(CU_URL,u.replace(/\/+$/,""));
  const k=document.getElementById("cu-key");if(k&&k.value.trim()){lsSet(CU_KEY,k.value.trim());st.editCu=false;}
  const m=(document.getElementById("cu-model").value||"").trim();if(m)lsSet(CU_MODEL,m);
  if(!lsGet(CU_KEY)){toast("Colle ta clé");return;}if(!lsGet(CU_MODEL)){toast("Choisis un modèle (📋 Liste)");return;}
  lsDel(CU_FMT);st.cuMsg="Test en cours...";st.cuOk=true;render();
  try{const t=await callCustom("Réponds en une phrase courte, en français.","Dis bonjour et donne ton nom de modèle.",200);st.cuOk=true;st.cuMsg="✓ Le moteur répond ("+(lsGet(CU_FMT)||"openai")+") : "+t.slice(0,90);}
  catch(ex){st.cuOk=false;st.cuMsg=ex.message;}
  render();}
async function cuListModels(){const u=(document.getElementById("cu-url").value||"").trim();if(u)lsSet(CU_URL,u.replace(/\/+$/,""));const k=document.getElementById("cu-key");if(k&&k.value.trim())lsSet(CU_KEY,k.value.trim());
  if(!lsGet(CU_KEY)){toast("Colle d'abord ta clé");return;}
  st.cuMsg="Chargement des modèles...";st.cuOk=true;render();
  try{st.cuModels=await cuModels();st.cuMsg=st.cuModels.length?st.cuModels.length+" modèles disponibles : touche celui que tu veux (les « claude » de préférence).":"Aucun modèle listé : écris le nom à la main.";st.cuOk=true;}
  catch(ex){st.cuOk=false;st.cuMsg=ex.message;}
  render();}
function saveTvKey(){const v=(document.getElementById("tv-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(TAVILY_KEY,v);st.editTv=false;testTavily();}
async function testTavily(){st.tvForce=true;setTimeout(()=>{st.tvForce=false;},15000);st.tvMsg="Test en cours...";st.tvOk=true;render();
  try{const j=await tavilySearch("Premier League prochains matchs",2);st.tvOk=true;lsDel("probet_tv_off");st.tvMsg="✓ Tavily répond ("+((j.results||[]).length)+" résultats) : "+String(j.answer||((j.results||[])[0]||{}).title||"").slice(0,70);}
  catch(ex){st.tvOk=false;st.tvMsg=ex.message;}
  render();}
function saveCbKey(){const v=(document.getElementById("cb-in").value||"").trim();if(!v){toast("Colle ta clé");return;}lsSet(CEREBRAS_KEY,v);st.editCb=false;testCerebras();}
async function testCerebras(){st.cbMsg="Test en cours...";st.cbOk=true;render();
  try{const t=await callCerebras("Réponds en un mot.","Dis OK",200);st.cbOk=true;st.cbMsg="✓ Cerebras répond : "+t.slice(0,40);}
  catch(ex){st.cbOk=false;st.cbMsg=(ex.message==="Failed to fetch"?"Connexion impossible depuis ce site (blocage du navigateur ou réseau). PROBET continuera avec Groq seul.":ex.message);}
  render();}
function clearCache(){
  try{Object.keys(localStorage).filter(k=>k.startsWith("probet_c_")).forEach(k=>localStorage.removeItem(k));}catch(_){}
  mem={};counts={};jSet("probet_counts",counts);toast("♻️ Cache vidé");
}

// ── Init ──────────────────────────────────────────────────────
(function cleanOldCache(){try{const t=todayISO();Object.keys(localStorage).filter(k=>k.startsWith("probet_c_")&&!k.includes(t)&&!k.includes("an_")).forEach(k=>localStorage.removeItem(k));}catch(_){}})();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
render();
async function autoDayCoupon(){
  try{
    if(!genCfg.autoDay||busy.gen) return;
    if(!IS_CLAUDE&&!getKey()) return;
    const t=todayISO();
    if(lsGet("probet_auto_day")===t) return;
    lsSet("probet_auto_day",t);
    setCv("gen");toast("🌅 5 victoires sûres du jour : le bot les prépare...");
    await runSafeWins();
    if(genRes&&!genRes.err){genRes.auto=true;genRes.day=t;jSet("probet_gen_result",genRes);toast("✅ Ton coupon du jour est prêt");}
    render();
  }catch(ex){console.warn(ex);}
}
setTimeout(autoDayCoupon,900);
setTimeout(()=>{try{if(apifKey()&&Date.now()-(+lsGet("probet_res_check")||0)>3*3600000&&(track.some(t=>!t.res)||hist.some(x=>(x.sels||[]).some(s=>!s.res))))checkResults(false);}catch(_){}},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(autoDayCoupon,500);});
if(!IS_CLAUDE&&!getKey()) setTimeout(()=>toast("🔑 Commence par ajouter ta clé API dans Menu"),600);
</script>
